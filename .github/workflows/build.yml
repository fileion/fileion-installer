# Tests, then builds the Windows .exe and the Linux AppImage reproducibly. Only GitHub's own actions, pinned to commit SHAs.
# Signing: the Windows .exe and the AppImage are unsigned for now.
name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string to build in, e.g. v0.1.0 (a release candidate build; the tag build of the same commit gives the same bytes)'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version-file: go.mod
          cache: false
      - run: gofmt -l . | tee /dev/stderr | (! read)
      - run: go vet ./... && go test ./...
      - run: GOOS=windows go vet ./...
  build:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build twice and compare (reproducible, -trimpath, no build ID, no VCS stamp)
        run: |
          V="${{ inputs.version || github.ref_name }}"; V="${V//\//-}"
          ./build.sh "$V" > /dev/null && cp dist/SHA256SUMS first.sums
          ./build.sh "$V" && diff first.sums dist/SHA256SUMS && echo "identical on the second build"
      - name: Check the file types (the .exe must be a Windows program, the other a Linux one)
        run: |
          [ "$(head -c2 dist/Fileion-Installer.exe)" = MZ ]
          [ "$(head -c4 dist/Fileion-Installer | tail -c3)" = ELF ]
          ! cmp -s dist/Fileion-Installer.exe dist/Fileion-Installer
      - name: "Check the .exe is a GUI program (PE subsystem 2: no console window can appear)"
        run: |
          pe=$(od -An -tu4 -j60 -N4 dist/Fileion-Installer.exe | tr -d ' ')
          sub=$(od -An -tu2 -j$((pe + 92)) -N2 dist/Fileion-Installer.exe | tr -d ' ')
          [ "$sub" = 2 ] || { echo "PE subsystem is $sub, expected 2 (windows GUI)"; exit 1; }
      - name: Check the icon and version info are in the .exe (UTF-16 strings of the version resource)
        run: |
          for t in "Fileion Installer" "Fileion-Installer.exe" "© Fileion"; do
            p=$(printf '%s' "$t" | iconv -f UTF-8 -t UTF-16LE | od -An -v -tx1 | tr -d ' \n')
            od -An -v -tx1 dist/Fileion-Installer.exe | tr -d ' \n' | grep -q "$p" || { echo "missing in the .exe: $t"; exit 1; }
          done
          ! od -An -v -tx1 dist/Fileion-Installer | tr -d ' \n' | grep -q "$(printf 'Fileion-Installer.exe' | iconv -f UTF-8 -t UTF-16LE | od -An -v -tx1 | tr -d ' \n')"  # not in the Linux file
      - name: Pack the AppImage (appimagetool is pinned by SHA-256)
        run: |
          sudo apt-get install -y --no-install-recommends desktop-file-utils > /dev/null
          mkdir -p AppDir/usr/bin
          cp dist/Fileion-Installer AppDir/usr/bin/fileion-installer
          cp packaging/AppRun AppDir/AppRun && chmod +x AppDir/AppRun
          cp packaging/fileion-installer.desktop AppDir/
          cp packaging/fileion-installer.png AppDir/fileion-installer.png && cp packaging/fileion-installer.png AppDir/.DirIcon
          curl -fsSL -o appimagetool "https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage"
          echo "46fdd785094c7f6e545b61afcfb0f3d98d8eab243f644b4b17698c01d06083d1  appimagetool" | sha256sum -c -
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir dist/Fileion-Installer.AppImage
          (cd dist && sha256sum Fileion-Installer.AppImage) | tee -a dist/SHA256SUMS
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: Fileion-Installer
          path: |
            dist/Fileion-Installer.exe
            dist/Fileion-Installer.AppImage
            dist/SHA256SUMS
      - name: A stamped AppImage reads its code (the stamp is appended after the image; $APPIMAGE points at the file)
        run: |
          go build -o stamp ./tools/stamp
          ./stamp -code 3fa91c0b dist/Fileion-Installer.AppImage "My special bundle.AppImage"
          chmod +x "My special bundle.AppImage"
          rm -f /tmp/fileion-installer.log
          ./"My special bundle.AppImage" --appimage-extract-and-run -no-window -base https://127.0.0.1:1 || true
          grep -q 'code 3fa91c0b (from the stamp)' /tmp/fileion-installer.log || { cat /tmp/fileion-installer.log; exit 1; }
          ./stamp -strip "My special bundle.AppImage" stripped.AppImage
          cmp stripped.AppImage dist/Fileion-Installer.AppImage && echo "the stripped copy is the release file"
