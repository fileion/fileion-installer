# Manual evidence run on a real Windows machine. Nothing here sets anything on fileion.com.
# Job 1 runs the installer against a local https test manifest. Job 2 runs real vendor installers silently (one matrix job each).
name: windows-test
on:
  workflow_dispatch:
    inputs:
      apps:
        description: 'Optional JSON list of {name, url, sha256, switch, timeout, type} (timeout in seconds; msi/wix runs through msiexec). Empty = every row of testlist/type-default.tsv'
        required: false
        default: ''
      release_tag:
        description: 'Test the PUBLISHED installer of this release (e.g. v0.1.0) instead of building it: its Fileion-Installer.exe is downloaded from GitHub and checked against the release SHA256SUMS and the MZ header. The type-default matrix is skipped.'
        required: false
        default: ''
      only_installer:
        description: 'Run only the installer job (no wait-detect, no type-default matrix)'
        type: boolean
        default: false
      set_code:
        description: 'With release_tag: a real set code (8-12 hex) to run against the LIVE manifest at software.fileion.com. Runs send no count except the one named in the summary.'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  installer:
    if: inputs.set_code == '' || inputs.release_tag == ''
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build the installer, a fake app and the test server
        run: |
          New-Item -ItemType Directory -Force C:\ftest\www\setup\manifest, C:\ftest\out | Out-Null
          go build -o C:\ftest\www\fakeapp.exe ./tools/fakeapp
          go build -o C:\ftest\testserver.exe ./tools/testserver
          go build -o C:\ftest\stamp.exe ./tools/stamp
          if ('${{ inputs.release_tag }}' -eq '') { go build -ldflags='-H=windowsgui' -o C:\ftest\Fileion-Test-and-1-more-aaaa1111.exe . }
      - name: Use the published release instead of a fresh build
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download '${{ inputs.release_tag }}' --repo ${{ github.repository }} --pattern 'Fileion-Installer.exe' --pattern SHA256SUMS --dir C:\ftest\rel
          $want = ((Get-Content C:\ftest\rel\SHA256SUMS | Where-Object { $_ -match 'Fileion-Installer\.exe' }) -split '\s+')[0]
          $have = (Get-FileHash C:\ftest\rel\Fileion-Installer.exe -Algorithm SHA256).Hash.ToLower()
          $mz = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes('C:\ftest\rel\Fileion-Installer.exe')[0..1])
          "release ${{ inputs.release_tag }}: SHA256SUMS $want, downloaded $have, header $mz" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          if ($want -ne $have -or $mz -ne 'MZ') { Write-Error 'The downloaded .exe does not match the release SHA256SUMS or is not a Windows program'; exit 1 }
          Copy-Item C:\ftest\rel\Fileion-Installer.exe C:\ftest\Fileion-Test-and-1-more-aaaa1111.exe
      - name: Trust a throwaway certificate
        run: |
          & "$env:ProgramFiles\Git\usr\bin\openssl.exe" req -x509 -newkey rsa:2048 -nodes -keyout C:\ftest\key.pem -out C:\ftest\cert.pem -days 1 -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" 2>$null
          certutil -addstore -f Root C:\ftest\cert.pem | Out-Null
      - name: Write the test manifests
        run: |
          $sha = (Get-FileHash C:\ftest\www\fakeapp.exe -Algorithm SHA256).Hash.ToLower()
          function App($id, $name, $code, $switch, $hash) {
            @{ id = $id; name = $name; version = '1.0'; min_version = '1.0'; url = 'https://127.0.0.1:8443/fakeapp.exe'; sha256 = $hash
               installer_type = 'exe'; architecture = 'x64'; silent_switch = $switch; product_code = $code; winget_id = "Test.$id"; page = "https://software.fileion.com/test-$id" }
          }
          function Write-Manifest($code, $apps) {
            @{ code = $code; os = 'windows'; apps = @($apps) } | ConvertTo-Json -Depth 5 | Set-Content "C:\ftest\www\setup\manifest\$code" -Encoding utf8
          }
          Write-Manifest 'aaaa1111' (App 1 'Test Install' '{FILEION-TEST-1}' '/S /CODE={FILEION-TEST-1}' $sha)
          Write-Manifest 'bbbb2222' (App 2 'Test Wrong Hash' '{FILEION-TEST-2}' '/S /CODE={FILEION-TEST-2}' ('0' * 64))
          Write-Manifest 'cccc3333' (App 3 'Test Hang' '{FILEION-TEST-3}' '/HANG' $sha)
          # v0.3.0 modes: portable, zip, interactive ("a few clicks"). A non-silent row carries NO silent switch, as the server contract says.
          foreach ($n in 'int-ok', 'int-closed', 'int-hang', 'int-linger', 'run-marker') { Copy-Item C:\ftest\www\fakeapp.exe "C:\ftest\www\$n.exe" }
          $tmp = 'C:\ftest\ziptmp'; New-Item -ItemType Directory -Force $tmp | Out-Null; Copy-Item C:\ftest\www\fakeapp.exe "$tmp\tool.exe"
          Compress-Archive -Path "$tmp\tool.exe" -DestinationPath C:\ftest\www\tool.zip -Force
          $zsha = (Get-FileHash C:\ftest\www\tool.zip -Algorithm SHA256).Hash.ToLower()
          function ModeApp($id, $name, $mode, $file, $hash, $type, $code) {
            $a = App $id $name $code '' $hash; $a.mode = $mode; $a.installer_type = $type; $a.url = "https://127.0.0.1:8443/$file"; $a
          }
          Write-Manifest 'pppp1111' (ModeApp 11 'Test Portable' 'portable' 'fakeapp.exe' $sha 'portable' $null)
          $z = ModeApp 12 'Test Zip' 'zip' 'tool.zip' $zsha 'zip' $null; $z.zip_exe = 'tool.exe'
          Write-Manifest 'zzzz2222' $z
          $ish = (Get-FileHash C:\ftest\www\int-ok.exe -Algorithm SHA256).Hash.ToLower()
          # the interactive app is listed FIRST and the silent one second: the program must still run the silent one first
          Write-Manifest 'iiii3333' @((ModeApp 21 'Test Interactive' 'interactive' 'int-ok.exe' $ish 'exe' '{FILEION-INT-OK}'), (ModeApp 22 'Test Silent Last' 'silent' 'fakeapp.exe' $sha 'exe' '{FILEION-TEST-22}' | ForEach-Object { $_.silent_switch = '/S /CODE={FILEION-TEST-22}'; $_ }))
          Write-Manifest 'iiii4444' (ModeApp 23 'Test Closed' 'interactive' 'int-closed.exe' (Get-FileHash C:\ftest\www\int-closed.exe -Algorithm SHA256).Hash.ToLower() 'exe' '{FILEION-INT-CLOSED}')
          Write-Manifest 'iiii5555' (ModeApp 24 'Test Hang Setup' 'interactive' 'int-hang.exe' (Get-FileHash C:\ftest\www\int-hang.exe -Algorithm SHA256).Hash.ToLower() 'exe' '{FILEION-INT-HANG}')
          Write-Manifest 'iiii8888' (ModeApp 25 'Test Linger' 'interactive' 'int-linger.exe' (Get-FileHash C:\ftest\www\int-linger.exe -Algorithm SHA256).Hash.ToLower() 'exe' '{FILEION-INT-LINGER}')
          # a portable app first, then an interactive setup that never returns: the run stays open on "Your turn", so the window's own buttons can be pressed
          Write-Manifest 'mmmm1111' @((ModeApp 41 'Test Marker' 'portable' 'run-marker.exe' (Get-FileHash C:\ftest\www\run-marker.exe -Algorithm SHA256).Hash.ToLower() 'portable' $null), (ModeApp 42 'Test Hang Setup' 'interactive' 'int-hang.exe' (Get-FileHash C:\ftest\www\int-hang.exe -Algorithm SHA256).Hash.ToLower() 'exe' '{FILEION-INT-HANG}'))
          # what an older installer (v0.2.0) must do with these: run only the silent row, start nothing else
          Write-Manifest 'oooo6666' @((ModeApp 31 'Old Portable' 'portable' 'fakeapp.exe' $sha 'portable' $null), $z, (ModeApp 33 'Old Interactive' 'interactive' 'int-ok.exe' $ish 'exe' '{FILEION-INT-OK}'), (App 34 'Old Silent' '{FILEION-TEST-OLD}' '/S /CODE={FILEION-TEST-OLD}' $sha | ForEach-Object { $_.mode = 'silent'; $_ }))
          Write-Manifest 'dddd4444' (App 4 'Test No Admin' '{FILEION-TEST-4}' '/S /CODE={FILEION-TEST-4}' $sha)
          # apps found by a name rule (DisplayName prefix + Publisher), no product code: the one in HKLM is older, the one in HKCU is newer
          function MatchApp($id, $name, $ver, $rule, $switch) {
            $a = App $id $name $null $switch $sha; $a.version = $ver; $a.min_version = $ver; $a.match = $rule; $a
          }
          Write-Manifest 'eeee6666' (MatchApp 6 'Test Match Update' '2.0' @{ name = 'Fileion Matchtest '; publisher = 'Fileion Test' } '/S /CODE={FILEION-MATCH-NEW} /NAME=Fileion_Matchtest_2.0 /PUBLISHER=Fileion_Test /VERSION=2.0')
          Write-Manifest 'ffff7777' (MatchApp 7 'Test Match HKCU' '4.0' @{ name = 'Fileion Hkcutest'; publisher = 'Fileion Test HKCU' } '/S /CODE={FILEION-MATCH-HKCU}')
      - name: Run the v0.3.0 cases
        id: v030
        if: always()
        continue-on-error: true
        timeout-minutes: 25
        run: |
          # started in this step: a process left running by an earlier step is cleaned up when that step ends
          Start-Process C:\ftest\testserver.exe -ArgumentList '-addr','127.0.0.1:8443','-dir','C:\ftest\www','-cert','C:\ftest\cert.pem','-key','C:\ftest\key.pem' -RedirectStandardError C:\ftest\out\server.log -WindowStyle Hidden
          Start-Sleep 3
          $ErrorActionPreference = 'Continue'
          # A GUI program: `&` does not wait for it and gives no exit code, so every run goes through Start-Process -Wait with its output in files
          # Every run has a time limit (the process tree is killed and the case is marked TIMEOUT with its name), and the step records the case it is on.
          $script:Started = @()
          function Reap { foreach ($q in $script:Started) { if (-not $q.HasExited) { taskkill /T /F /PID $q.Id | Out-Null } }; $script:Started = @() }
          function Inst($exe, [string[]]$a, [int]$limit = 240) {
            Reap
            $o = 'C:\ftest\out\_o.txt'; $e = 'C:\ftest\out\_e.txt'
            Remove-Item $o, $e -ErrorAction SilentlyContinue
            "$(Get-Date -Format o) Inst $a" | Add-Content C:\ftest\out\progress.txt
            $p = Start-Process -FilePath $exe -ArgumentList $a -PassThru -RedirectStandardOutput $o -RedirectStandardError $e -WindowStyle Hidden
            $null = $p.Handle
            if (-not $p.WaitForExit($limit * 1000)) {
              taskkill /T /F /PID $p.Id | Out-Null
              $script:rows += "| TIMEOUT: $a | FAIL | no exit after $limit s, process tree killed |"; $script:fail += "TIMEOUT: $a"
              $script:LASTEXIT = -1
            } else { $script:LASTEXIT = $p.ExitCode }
            (Get-Content $o -Raw -ErrorAction SilentlyContinue) + (Get-Content $e -Raw -ErrorAction SilentlyContinue)
          }
          $fail = @()
          $rows = @()
          function Key($code) { Test-Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\$code" }
          function Check($name, $ok, $detail) {
            $script:rows += "| $name | $(if ($ok) {'PASS'} else {'FAIL'}) | $detail |"
            if (-not $ok) { $script:fail += $name }
          }
          $installer = 'C:\ftest\Fileion-Test-and-1-more-aaaa1111.exe'
          $env:FILEION_INSTALLER_ELEVATED = '1'   # the runner is already an administrator: skip the permission prompt
          $common = @('-base', 'https://127.0.0.1:8443', '-no-window', '-no-report')

          # 11-17. v0.3.0 (a fresh build only: an older installer does not know these modes; the published-release run has the old-installer case below)
          if ('${{ inputs.release_tag }}' -eq '') {
            $env:FILEION_INSTALLER_ELEVATED = '1'
            $dl = [Environment]::ExpandEnvironmentVariables((Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\User Shell Folders').'{374DE290-123F-4565-9164-39C4925E467B}')
            $apps = Join-Path $dl 'Fileion Apps'
            $log = Join-Path $env:TEMP 'fileion-installer.log'
            $un = 'SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall'
            function Wait-Log($pattern, $secs) { $end = (Get-Date).AddSeconds($secs); while ((Get-Date) -lt $end) { if ((Get-Content $log -Raw -ErrorAction SilentlyContinue) -match $pattern) { return $true }; Start-Sleep -Milliseconds 300 }; $false }
            $modes = 'C:\ftest\out\fakeapp-modes.log'
            # the fake setup is a temp file named fileion-*.exe, so its mode comes from C:\ftest\mode.txt; every case checks its fake REALLY ran in that mode
            function Fakes($m) { @(Get-Content $modes -ErrorAction SilentlyContinue | Where-Object { $_ -match "mode=$m( |$)" } | ForEach-Object { [int]($_ -replace '.*pid=', '') }) }
            function Alive($m) { @(Fakes $m | Where-Object { Get-Process -Id $_ -ErrorAction SilentlyContinue }).Count }
            function Kill-Fakes { Get-Content $modes -ErrorAction SilentlyContinue | ForEach-Object { Stop-Process -Id ([int]($_ -replace '.*pid=', '')) -Force -ErrorAction SilentlyContinue }; Remove-Item C:\ftest\mode.txt -ErrorAction SilentlyContinue }
            function Skip($name, $detail) { $script:rows += "| $name | SKIP (runner) | $detail |" }
            function Start-Inst($code, $name, $mode = '') { Reap; Kill-Fakes; Remove-Item $modes -ErrorAction SilentlyContinue; if ($mode) { Set-Content C:\ftest\mode.txt $mode } else { Remove-Item C:\ftest\mode.txt -ErrorAction SilentlyContinue }; Remove-Item $log -ErrorAction SilentlyContinue; "$(Get-Date -Format o) Start-Inst $code $name" | Add-Content C:\ftest\out\progress.txt; $q = Start-Process $installer -ArgumentList ($common + @('-code', $code)) -PassThru -WindowStyle Hidden -RedirectStandardOutput "C:\ftest\out\$name.txt"; $null = $q.Handle; $script:Started += $q; $q }
            function Window-Url { ([regex]::Match((Get-Content $log -Raw), 'window: (http://127\.0\.0\.1:\d+/t/[0-9a-f]+/)')).Groups[1].Value }

            # 11. no console window: a GUI program (PE subsystem 2) with no console child while it works
            $bytes = [IO.File]::ReadAllBytes($installer); $pe = [BitConverter]::ToInt32($bytes, 60); $sub = [BitConverter]::ToUInt16($bytes, $pe + 92)
            $p = Start-Inst 'cccc3333' 'case11-noconsole'
            Start-Sleep 5
            $con = @(Get-CimInstance Win32_Process -Filter "ParentProcessId=$($p.Id)" | Where-Object { $_.Name -eq 'conhost.exe' }).Count
            taskkill /T /F /PID $p.Id | Out-Null; Stop-Process -Name fakeapp -Force -ErrorAction SilentlyContinue
            Check 'no console window: GUI subsystem, no console host under the installer' ($sub -eq 2 -and $con -eq 0) "PE subsystem $sub, console hosts: $con"

            # 12. portable: saved in its own folder under Downloads, not run, listed; the next run skips it
            Remove-Item $apps -Recurse -Force -ErrorAction SilentlyContinue; Remove-Item "$env:LOCALAPPDATA\Fileion\portable.json" -ErrorAction SilentlyContinue
            $out = Inst $installer ($common + @('-code','pppp1111')); $c12 = $script:LASTEXIT
            $out | Set-Content C:\ftest\out\case12a-portable.txt
            Check 'portable: saved in Downloads\Fileion Apps\<App>, not run' ($c12 -eq 0 -and $out -match 'saved' -and (Test-Path "$apps\Test Portable\fakeapp.exe") -and -not (Get-Process -Name fakeapp -ErrorAction SilentlyContinue)) "exit $c12"
            $out = Inst $installer ($common + @('-code','pppp1111')); $c12b = $script:LASTEXIT
            Check 'portable: the next run finds it in portable.json and skips it' ($c12b -eq 0 -and $out -match 'up-to-date' -and (Select-String -Path "$env:LOCALAPPDATA\Fileion\portable.json" -Pattern 'Test.11' -Quiet)) "exit $c12b"

            # 13. zip: verified, unpacked into its folder, the zip deleted
            $out = Inst $installer ($common + @('-code','zzzz2222')); $c13 = $script:LASTEXIT
            $out | Set-Content C:\ftest\out\case13-zip.txt
            $zipsLeft = @(Get-ChildItem $env:TEMP -Filter 'fileion-*.zip' -ErrorAction SilentlyContinue).Count
            Check 'zip: unpacked into its folder and the zip is deleted' ($c13 -eq 0 -and $out -match 'saved' -and (Test-Path "$apps\Test Zip\tool.exe") -and $zipsLeft -eq 0) "exit $c13, zips left: $zipsLeft"

            # 14. interactive: runs after the silent app; the setup starts the real setup and exits (the whole process tree is waited for); the person finishes it
            Remove-Item C:\ftest\marker-ok -ErrorAction SilentlyContinue; reg delete "HKLM\$un\{FILEION-INT-OK}" /f 2>$null | Out-Null
            $p = Start-Inst 'iiii3333' 'case14-interactive' 'int-ok'
            $turn = Wait-Log 'yourturn' 60
            Start-Sleep 3; $waiting = (Alive 'int-ok') -ge 1 -and (Get-Content $log -Raw) -notmatch 'notfinished'   # the fake setup is alive and the row has not given up
            $early = (Get-Content $log -Raw) -notmatch 'Test Interactive: done'
            New-Item C:\ftest\marker-ok -ItemType File -Force | Out-Null   # the person finishes the setup
            $ended = $p.WaitForExit(60000)
            $lg = Get-Content $log -Raw -ErrorAction SilentlyContinue
            $order = $lg.IndexOf('Test Silent Last: done') -ge 0 -and $lg.IndexOf('Test Silent Last: done') -lt $lg.IndexOf('Test Interactive: yourturn')
            Check 'interactive: runs last, waits for the whole setup, then Done' ((Fakes 'int-ok').Count -ge 1 -and $waiting -and $turn -and $early -and $ended -and $order -and $p.ExitCode -eq 0 -and (Key '{FILEION-INT-OK}')) "fake ran: $((Fakes 'int-ok').Count), waiting: $waiting, your turn: $turn, ended: $ended, order ok: $order, key: $(Key '{FILEION-INT-OK}')"

            # 15. interactive, setup closed without installing: Not finished; Skip (POST on the window's address) moves on, nothing is a failure
            $p = Start-Inst 'iiii4444' 'case15-closed' 'int-closed'
            $nf = Wait-Log 'notfinished' 60
            $url = Window-Url
            if ($url) { Invoke-WebRequest "${url}row/skip?i=0" -Method Post -UseBasicParsing | Out-Null }
            $ended = $p.WaitForExit(30000)
            Check 'interactive: setup closed early is Not finished, Skip ends it, no failure' ((Fakes 'int-closed').Count -eq 1 -and $nf -and $ended -and $p.ExitCode -eq 0 -and ((Get-Content C:\ftest\out\case15-closed.txt -Raw) -match 'skipped')) "fake ran: $((Fakes 'int-closed').Count), not finished: $nf, ended: $ended"

            # 16. interactive setup that never returns: Skip ends the whole job, nothing is left running
            $p = Start-Inst 'iiii5555' 'case16-hang' 'int-hang'
            $turn = Wait-Log 'yourturn' 60
            Start-Sleep 3; $waiting = (Alive 'int-hang') -eq 1 -and (Get-Content $log -Raw) -notmatch 'notfinished'   # still waiting, not given up
            $url = Window-Url
            if ($url) { Invoke-WebRequest "${url}row/skip?i=0" -Method Post -UseBasicParsing | Out-Null }
            $ended = $p.WaitForExit(30000)
            $left = Alive 'int-hang'
            Check 'interactive: Skip ends a setup that never returns' ((Fakes 'int-hang').Count -eq 1 -and $waiting -and $turn -and $ended -and $left -eq 0) "fake ran: $((Fakes 'int-hang').Count), waiting: $waiting, ended: $ended, processes left: $left"

            # 17. the hash is checked before a setup window opens
            $bad = Get-Content C:\ftest\www\setup\manifest\iiii4444 -Raw | ConvertFrom-Json; $bad.apps[0].sha256 = ('0' * 64); $bad.code = 'iiii7777'
            $bad | ConvertTo-Json -Depth 5 | Set-Content C:\ftest\www\setup\manifest\iiii7777 -Encoding utf8
            Kill-Fakes; Remove-Item $modes -ErrorAction SilentlyContinue
            $out = Inst $installer ($common + @('-code','iiii7777')); $c17 = $script:LASTEXIT
            Check 'interactive: a wrong hash is refused before any setup window opens' ($c17 -eq 1 -and -not (Test-Path $modes) -and (Fakes '.*').Count -eq 0 -and $out -match 'mismatch' -and $out -notmatch 'yourturn') "exit $c17"

            # 18a. a setup that installs, launches the app and exits: its job never empties, so the installer must go on (Done) after a short grace, and NOT kill the app
            Kill-Fakes
            $p = Start-Inst 'iiii8888' 'case18a-linger' 'int-linger'
            $ended = $p.WaitForExit(120000)
            $alive = Alive 'int-linger'; $ran = (Fakes 'int-linger').Count
            Kill-Fakes
            Check 'interactive: a setup that leaves the launched app running is Done, and the app is not killed' ($ended -and $p.ExitCode -eq 0 -and ((Get-Content C:\ftest\out\case18a-linger.txt -Raw) -match 'done') -and $ran -ge 2 -and $alive -ge 1) "fake ran (setup + app): $ran, ended: $ended, app still running: $alive"

            # 18b. hand-off: the elevated copy writes its window's address to the file it was given
            Remove-Item C:\ftest\h.txt -ErrorAction SilentlyContinue
            $out = Inst $installer ($common + @('-code','aaaa1111','-handoff','C:\ftest\h.txt')); $c18b = $script:LASTEXIT
            $h = Get-Content C:\ftest\h.txt -Raw -ErrorAction SilentlyContinue
            Check 'hand-off: the elevated copy writes its own window address' ($c18b -eq 0 -and $h -match '^http://127\.0\.0\.1:\d+/t/[0-9a-f]+/$') "exit $c18b, address: $h"

            # 18c. the window's own buttons on a portable row (Run as the user, Move…) and Stop on an open setup, through the window's local address
            Remove-Item "$apps\Test Marker", C:\ftest\moveto, C:\ftest\run-marker.txt -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force C:\ftest\moveto | Out-Null
            $env:FILEION_INSTALLER_TEST_PICK = 'C:\ftest\moveto'
            $p = Start-Inst 'mmmm1111' 'case18c-buttons' 'int-hang'
            $turn = Wait-Log 'yourturn' 60
            Start-Sleep 3; $waiting = (Alive 'int-hang') -eq 1 -and (Get-Content $log -Raw) -notmatch 'notfinished'
            $url = Window-Url
            Invoke-WebRequest "${url}row/run?i=0" -Method Post -UseBasicParsing | Out-Null
            $end = (Get-Date).AddSeconds(30); while (-not (Test-Path C:\ftest\run-marker.txt) -and (Get-Date) -lt $end) { Start-Sleep -Milliseconds 300 }
            $level = Get-Content C:\ftest\run-marker.txt -Raw -ErrorAction SilentlyContinue
            $lua = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -ErrorAction SilentlyContinue).EnableLUA
            $mine = if ((whoami /groups) -match 'High Mandatory Level') { 'high' } else { 'medium' }
            "runner: EnableLUA=$lua, this shell runs at the $mine level" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
            if ($lua -eq 0) { Skip 'Run starts a portable app as the normal user, not as administrator' "the runner has UAC off (EnableLUA=0): there is no normal level to drop to; the app started at the $level level" }
            else { Check 'Run starts a portable app as the normal user, not as administrator' ($turn -and $level -eq 'medium') "EnableLUA=$lua, runner shell $mine, started at the $level level" }
            Invoke-WebRequest "${url}row/move?i=0" -Method Post -UseBasicParsing | Out-Null
            $end = (Get-Date).AddSeconds(30); while (-not (Test-Path 'C:\ftest\moveto\Test Marker\run-marker.exe') -and (Get-Date) -lt $end) { Start-Sleep -Milliseconds 300 }
            $end = (Get-Date).AddSeconds(10); do { $listed = Select-String -Path "$env:LOCALAPPDATA\Fileion\portable.json" -Pattern 'moveto' -Quiet -ErrorAction SilentlyContinue; if (-not $listed) { Start-Sleep -Milliseconds 300 } } while (-not $listed -and (Get-Date) -lt $end)
            Check 'Move puts the app in the chosen folder and the list follows it' ((Test-Path 'C:\ftest\moveto\Test Marker\run-marker.exe') -and -not (Test-Path "$apps\Test Marker") -and $listed) "moved: $(Test-Path 'C:\ftest\moveto\Test Marker\run-marker.exe'), listed: $listed"
            Remove-Item Env:FILEION_INSTALLER_TEST_PICK -ErrorAction SilentlyContinue
            Invoke-WebRequest "${url}stop" -Method Post -UseBasicParsing | Out-Null
            $ended = $p.WaitForExit(30000)
            $left = Alive 'int-hang'
            Check 'Stop ends an open setup, says Stopped and leaves nothing running' ((Fakes 'int-hang').Count -eq 1 -and $waiting -and $ended -and $p.ExitCode -eq 0 -and ((Get-Content C:\ftest\out\case18c-buttons.txt -Raw) -match 'cancelled') -and $left -eq 0) "fake ran: $((Fakes 'int-hang').Count), waiting: $waiting, ended: $ended, processes left: $left"
            Kill-Fakes
            Remove-Item Env:FILEION_INSTALLER_ELEVATED -ErrorAction SilentlyContinue
          }

          # 18. an older installer (the published release) against the new modes: it runs only the silent row and starts nothing else
          if ('${{ inputs.release_tag }}' -ne '') {
            $env:FILEION_INSTALLER_ELEVATED = '1'
            $dl = [Environment]::ExpandEnvironmentVariables((Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\User Shell Folders').'{374DE290-123F-4565-9164-39C4925E467B}')
            Remove-Item "$dl\Fileion Apps" -Recurse -Force -ErrorAction SilentlyContinue
            $out = Inst $installer ($common + @('-code','oooo6666')); $c18 = $script:LASTEXIT
            $out | Set-Content C:\ftest\out\case18-old-installer.txt
            $skipped = ([regex]::Matches($out, 'unsupported')).Count
            Check 'older installer: portable, zip and interactive rows are not run, the silent row is' ($skipped -eq 3 -and (Key '{FILEION-TEST-OLD}') -and -not (Key '{FILEION-INT-OK}') -and -not (Test-Path "$dl\Fileion Apps") -and -not (Get-Process -Name fakeapp, int-ok -ErrorAction SilentlyContinue)) "unsupported rows: $skipped, silent installed: $(Key '{FILEION-TEST-OLD}')"
            Remove-Item Env:FILEION_INSTALLER_ELEVATED -ErrorAction SilentlyContinue
          }

          "### v0.3.0 cases`n| Case | Result | Detail |`n|---|---|---|`n$($rows -join "`n")" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          if ($fail.Count) { Write-Error "Failed: $($fail -join '; ')"; exit 1 }
      - name: Run the cases
        id: old
        if: always()
        continue-on-error: true
        timeout-minutes: 25
        run: |
          # started in this step: a process left running by an earlier step is cleaned up when that step ends
          Start-Process C:\ftest\testserver.exe -ArgumentList '-addr','127.0.0.1:8443','-dir','C:\ftest\www','-cert','C:\ftest\cert.pem','-key','C:\ftest\key.pem' -RedirectStandardError C:\ftest\out\server.log -WindowStyle Hidden
          Start-Sleep 3
          $ErrorActionPreference = 'Continue'
          # A GUI program: `&` does not wait for it and gives no exit code, so every run goes through Start-Process -Wait with its output in files
          # Every run has a time limit (the process tree is killed and the case is marked TIMEOUT with its name), and the step records the case it is on.
          $script:Started = @()
          function Reap { foreach ($q in $script:Started) { if (-not $q.HasExited) { taskkill /T /F /PID $q.Id | Out-Null } }; $script:Started = @() }
          function Inst($exe, [string[]]$a, [int]$limit = 240) {
            Reap
            $o = 'C:\ftest\out\_o.txt'; $e = 'C:\ftest\out\_e.txt'
            Remove-Item $o, $e -ErrorAction SilentlyContinue
            "$(Get-Date -Format o) Inst $a" | Add-Content C:\ftest\out\progress.txt
            $p = Start-Process -FilePath $exe -ArgumentList $a -PassThru -RedirectStandardOutput $o -RedirectStandardError $e -WindowStyle Hidden
            $null = $p.Handle
            if (-not $p.WaitForExit($limit * 1000)) {
              taskkill /T /F /PID $p.Id | Out-Null
              $script:rows += "| TIMEOUT: $a | FAIL | no exit after $limit s, process tree killed |"; $script:fail += "TIMEOUT: $a"
              $script:LASTEXIT = -1
            } else { $script:LASTEXIT = $p.ExitCode }
            (Get-Content $o -Raw -ErrorAction SilentlyContinue) + (Get-Content $e -Raw -ErrorAction SilentlyContinue)
          }
          $fail = @()
          $rows = @()
          function Key($code) { Test-Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\$code" }
          function Check($name, $ok, $detail) {
            $script:rows += "| $name | $(if ($ok) {'PASS'} else {'FAIL'}) | $detail |"
            if (-not $ok) { $script:fail += $name }
          }
          reg delete "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\{FILEION-TEST-1}" /f 2>$null | Out-Null
          $installer = 'C:\ftest\Fileion-Test-and-1-more-aaaa1111.exe'
          $env:FILEION_INSTALLER_ELEVATED = '1'   # the runner is already an administrator: skip the permission prompt
          $common = @('-base', 'https://127.0.0.1:8443', '-no-window', '-no-report')

          # 1. install, with the code read from the file name
          $out = Inst $installer $common; $code1 = $script:LASTEXIT
          $out | Set-Content C:\ftest\out\case1-install.txt
          Check 'install (code from file name)' ((Key '{FILEION-TEST-1}') -and $code1 -eq 0 -and $out -match 'done') "exit $code1, Uninstall key present: $(Key '{FILEION-TEST-1}')"

          # 2. run again: it must skip what is installed (no second download)
          $before = (Select-String -Path C:\ftest\out\server.log -Pattern 'fakeapp' -ErrorAction SilentlyContinue | Measure-Object).Count
          $out = Inst $installer $common; $code2 = $script:LASTEXIT
          $out | Set-Content C:\ftest\out\case2-rerun.txt
          Check 're-run skips the installed app' ($code2 -eq 0 -and $out -match 'up-to-date') "exit $code2"

          # 3. wrong SHA-256: it must refuse and install nothing
          $out = Inst $installer ($common + @('-code','bbbb2222')); $code3 = $script:LASTEXIT
          $out | Set-Content C:\ftest\out\case3-sha-mismatch.txt
          Check 'wrong SHA-256 is refused' ((-not (Key '{FILEION-TEST-2}')) -and $code3 -eq 1 -and $out -match 'mismatch') "exit $code3, Uninstall key present: $(Key '{FILEION-TEST-2}')"

          # 4. a hung installer: stopped at -app-timeout, nothing left running
          Remove-Item C:\ftest\out\fakeapp-modes.log, C:\ftest\mode.txt -ErrorAction SilentlyContinue
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $out = Inst $installer ($common + @('-code','cccc3333','-app-timeout','20s')); $code4 = $script:LASTEXIT
          $sw.Stop()
          $out | Set-Content C:\ftest\out\case4-hang.txt
          # the hung fake is a temp file named fileion-*.exe: look for it by the pid it logged
          $left = @(Get-Content C:\ftest\out\fakeapp-modes.log -ErrorAction SilentlyContinue | ForEach-Object { [int]($_ -replace '.*pid=', '') } | Where-Object { $q = Get-Process -Id $_ -ErrorAction SilentlyContinue; $q -and -not $q.HasExited }).Count   # only a process really still running
          Check 'hung installer stops at the time limit' ($out -match 'manual' -and $left -eq 0 -and $sw.Elapsed.TotalSeconds -lt 90) "$([int]$sw.Elapsed.TotalSeconds)s, processes left: $left"

          # 5. the count: sent at the end by default, and not at all when "Don't send" is ticked in the window. The window's own tick is POST report?send=0
          #    on its local address (printed in the log); the 30 s hung installer keeps the run open long enough to do it. No -no-report here.
          function Count-Requests { @(Select-String -Path C:\ftest\out\server.log -Pattern 'REQ POST /setup/report' -ErrorAction SilentlyContinue).Count }
          foreach ($tick in $true, $false) {
            Remove-Item "$env:TEMP\fileion-installer.log" -ErrorAction SilentlyContinue
            $n0 = Count-Requests
            $p = Start-Process $installer -ArgumentList @('-base', 'https://127.0.0.1:8443', '-no-window', '-code', 'cccc3333', '-app-timeout', '30s') -PassThru -WindowStyle Hidden -RedirectStandardOutput C:\ftest\out\case5.txt
            $url = $null
            for ($i = 0; $i -lt 40 -and -not $url; $i++) {
              Start-Sleep 1
              $m = Select-String -Path "$env:TEMP\fileion-installer.log" -Pattern 'window: (http\S+)' -ErrorAction SilentlyContinue
              if ($m) { $url = $m.Matches[0].Groups[1].Value }
            }
            if ($tick -and $url) { Invoke-WebRequest -Method Post -Uri "${url}report?send=0" -UseBasicParsing | Out-Null }
            $null = $p.WaitForExit(120000)
            Start-Sleep 2
            $sent = (Count-Requests) - $n0
            $lg = Get-Content "$env:TEMP\fileion-installer.log" -Raw -ErrorAction SilentlyContinue
            if ($tick) {
              Check 'count: "Don''t send" ticked means no report request' ($url -and $sent -eq 0 -and $lg -match "Don't send was ticked") "window found: $([bool]$url), report requests: $sent"
            } else {
              Check 'count: not ticked means one report request at the end' ($url -and $sent -eq 1) "window found: $([bool]$url), report requests: $sent"
            }
          }

          # 6. a standard user, twice. (a) FILEION_INSTALLER_ELEVATED=1 is the state after a declined prompt; (b) without it, the real path: the
          #    installer asks Windows for elevation first. A headless runner cannot click UAC: Windows accepts the request and leaves the prompt pending, so
          #    (b) asserts the attempt in the log and that nothing is installed while the prompt waits (the process is then stopped); the message is asserted in (a), the state a declined prompt leaves.
          $pw = ConvertTo-SecureString 'Fileion-Test-9x!' -AsPlainText -Force
          New-LocalUser -Name ftestuser -Password $pw -AccountNeverExpires | Out-Null
          New-Item -ItemType Directory -Force C:\ftest\tmp | Out-Null
          icacls C:\ftest /grant 'ftestuser:(OI)(CI)F' /T | Out-Null
          $cred = New-Object Management.Automation.PSCredential('ftestuser', $pw)
          $env:TEMP = 'C:\ftest\tmp'; $env:TMP = 'C:\ftest\tmp'
          $msg = 'Administrator rights are needed to install apps, so nothing was installed.'
          foreach ($variant in 'a', 'b') {
            Remove-Item C:\ftest\tmp\fileion-installer.log -ErrorAction SilentlyContinue
            if ($variant -eq 'a') { $env:FILEION_INSTALLER_ELEVATED = '1' } else { Remove-Item Env:FILEION_INSTALLER_ELEVATED -ErrorAction SilentlyContinue }
            $name = "case5$variant-no-admin"
            $p = Start-Process $installer -ArgumentList ($common + @('-code', 'dddd4444', '-app-timeout', '60s')) -Credential $cred -WorkingDirectory C:\ftest `
                 -RedirectStandardOutput "C:\ftest\out\$name.txt" -RedirectStandardError "C:\ftest\out\$name.err" -PassThru -WindowStyle Hidden -ErrorAction Continue
            $done = $p -and $p.WaitForExit($(if ($variant -eq 'a') { 90000 } else { 20000 }))
            if ($p -and -not $done) { taskkill /T /F /PID $p.Id | Out-Null }
            $o = (Get-Content "C:\ftest\out\$name.txt" -Raw -ErrorAction SilentlyContinue)
            $lg = (Get-Content C:\ftest\tmp\fileion-installer.log -Raw -ErrorAction SilentlyContinue)
            Copy-Item C:\ftest\tmp\fileion-installer.log "C:\ftest\out\$name.log" -ErrorAction SilentlyContinue
            $texts = ($o -match [regex]::Escape($msg)) -and ($o -match 'Log: ') -and ($o -match 'nothing was installed')
            $attempt = if ($variant -eq 'b') { $lg -match 'asking Windows for elevation' } else { $true }
            $ok = if ($variant -eq 'a') { $texts -and $p.ExitCode -eq 1 } else { $true }
            Check "standard user ($variant): $(if ($variant -eq 'a') {'says admin rights are needed and nothing was installed'} else {'asks Windows for elevation, installs nothing while the prompt waits'})" (($done -or $variant -eq 'b') -and $ok -and $attempt -and (-not (Key '{FILEION-TEST-4}'))) "finished: $done, exit $(if ($p) {$p.ExitCode}), message: $texts, elevation attempt logged: $attempt, Uninstall key present: $(Key '{FILEION-TEST-4}')"
          }
          Remove-Item Env:FILEION_INSTALLER_ELEVATED -ErrorAction SilentlyContinue
          $env:TEMP = $env:RUNNER_TEMP

          # 6-8. the code stamped inside the file: a renamed file works, the same file copied to another folder (a pendrive) works twice, and a file with no code says so (only for a fresh build: a published release older than v0.2.0 does not read stamps)
          if ('${{ inputs.release_tag }}' -eq '') {
            $env:FILEION_INSTALLER_ELEVATED = '1'
            New-Item -ItemType Directory -Force C:\ftest\pen, C:\ftest\pen2 | Out-Null
            $stamped = 'C:\ftest\pen\My special bundle.exe'
            & C:\ftest\stamp.exe -code aaaa1111 C:\ftest\Fileion-Test-and-1-more-aaaa1111.exe $stamped
            Check 'stamp tool: -show reads the code back' ((& C:\ftest\stamp.exe -show $stamped) -eq 'aaaa1111') 'stamp -show'
            $out = Inst $stamped $common; $code6 = $script:LASTEXIT
            $out | Set-Content C:\ftest\out\case6-stamped-renamed.txt
            $logged = [bool](Select-String -Path (Join-Path ([IO.Path]::GetTempPath()) 'fileion-installer.log') -Pattern 'code aaaa1111 \(from the stamp\)' -ErrorAction SilentlyContinue)
            Check 'stamped file renamed to "My special bundle.exe" reads its list' ($code6 -eq 0 -and $out -match 'up-to-date' -and $logged) "exit $code6, log says from the stamp: $logged"
            Copy-Item $stamped 'C:\ftest\pen2\copy of the bundle.exe'
            $copy = 'C:\ftest\pen2\copy of the bundle.exe'
            $out1 = Inst $copy $common; $c7a = $script:LASTEXIT
            $out2 = Inst $copy $common; $c7b = $script:LASTEXIT
            Check 'the copy runs twice on another folder (pendrive)' ($c7a -eq 0 -and $c7b -eq 0 -and $out1 -match 'up-to-date' -and $out2 -match 'up-to-date') "exit $c7a / $c7b"
            Copy-Item C:\ftest\Fileion-Test-and-1-more-aaaa1111.exe C:\ftest\Fileion-Installer.exe
            $out = Inst C:\ftest\Fileion-Installer.exe $common; $code8 = $script:LASTEXIT
            Check 'a file with no code says so (exit 2)' ($code8 -eq 2 -and $out -match 'no app list') "exit $code8"
            $strip = 'C:\ftest\pen\stripped.exe'; & C:\ftest\stamp.exe -strip $stamped $strip
            Check 'stripping the stamp gives the original bytes' ((Get-FileHash $strip).Hash -eq (Get-FileHash C:\ftest\Fileion-Test-and-1-more-aaaa1111.exe).Hash) 'SHA-256 of the stripped copy'
            Remove-Item Env:FILEION_INSTALLER_ELEVATED -ErrorAction SilentlyContinue
          }

          # 9-10. an app found by name + publisher instead of a key: older -> updated, then skipped; HKCU only -> skipped; Opera-like lookalike untouched
          if ('${{ inputs.release_tag }}' -eq '') {
            $env:FILEION_INSTALLER_ELEVATED = '1'
            $un = 'SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall'
            reg add "HKLM\$un\{FILEION-MATCH-OLD}" /v DisplayName /d 'Fileion Matchtest 1.0' /f | Out-Null
            reg add "HKLM\$un\{FILEION-MATCH-OLD}" /v Publisher /d 'Fileion Test' /f | Out-Null
            reg add "HKLM\$un\{FILEION-MATCH-OLD}" /v DisplayVersion /d '1.0' /f | Out-Null
            reg add "HKLM\$un\{FILEION-MATCH-LOOKALIKE}" /v DisplayName /d 'Fileion Matchtest GX 9.0' /f | Out-Null
            reg add "HKLM\$un\{FILEION-MATCH-LOOKALIKE}" /v Publisher /d 'Someone Else' /f | Out-Null
            reg add "HKLM\$un\{FILEION-MATCH-LOOKALIKE}" /v DisplayVersion /d '9.0' /f | Out-Null
            $out = Inst $installer ($common + @('-code','eeee6666')); $c9a = $script:LASTEXIT
            $out | Set-Content C:\ftest\out\case9a-match-update.txt
            Check 'name rule: an older install is updated' ($c9a -eq 0 -and $out -match 'done' -and (Key '{FILEION-MATCH-NEW}')) "exit $c9a, new entry present: $(Key '{FILEION-MATCH-NEW}')"
            $out = Inst $installer ($common + @('-code','eeee6666')); $c9b = $script:LASTEXIT
            $out | Set-Content C:\ftest\out\case9b-match-skip.txt
            Check 'name rule: the next run skips it (a lookalike from another publisher is not counted)' ($c9b -eq 0 -and $out -match 'up-to-date') "exit $c9b"
            reg add "HKCU\$un\{FILEION-MATCH-HKCU}" /v DisplayName /d 'Fileion Hkcutest 5.0' /f | Out-Null
            reg add "HKCU\$un\{FILEION-MATCH-HKCU}" /v Publisher /d 'Fileion Test HKCU' /f | Out-Null
            reg add "HKCU\$un\{FILEION-MATCH-HKCU}" /v DisplayVersion /d '5.0' /f | Out-Null
            $out = Inst $installer ($common + @('-code','ffff7777')); $c10 = $script:LASTEXIT
            $out | Set-Content C:\ftest\out\case10-match-hkcu.txt
            Check 'name rule: an entry only in HKCU is found' ($c10 -eq 0 -and $out -match 'up-to-date') "exit $c10"
            Remove-Item Env:FILEION_INSTALLER_ELEVATED -ErrorAction SilentlyContinue
          }


          Copy-Item "$env:RUNNER_TEMP\fileion-installer.log" C:\ftest\out\installer.log -ErrorAction SilentlyContinue
          "### Installer cases`n| Case | Result | Detail |`n|---|---|---|`n$($rows -join "`n")" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          if ($fail.Count) { Write-Error "Failed: $($fail -join '; ')"; exit 1 }
      - name: Collect the installer logs
        if: always()
        run: |
          foreach ($f in "$env:RUNNER_TEMP\fileion-installer.log", "$env:TEMP\fileion-installer.log", 'C:\ftest\tmp\fileion-installer.log') { if (Test-Path $f) { Copy-Item $f ("C:\ftest\out\" + ($f -replace '[:\\]','_')) -ErrorAction SilentlyContinue } }
          Get-ChildItem "$env:LOCALAPPDATA\Fileion" -ErrorAction SilentlyContinue | ForEach-Object { Copy-Item $_.FullName C:\ftest\out\ -Recurse -ErrorAction SilentlyContinue }
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        if: always()
        with:
          name: installer-cases
          path: C:\ftest\out\
      - name: Fail the job if any case failed or timed out
        if: always() && (steps.v030.outcome != 'success' || steps.old.outcome != 'success')
        shell: pwsh
        run: |
          "v0.3.0 cases: ${{ steps.v030.outcome }}, old cases: ${{ steps.old.outcome }}" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          exit 1

  window:
    # the owner's third "window too tall" report: Edge restored the size it saved from older runs. v0.2.0 runs first and its window is made big and closed (so Edge
    # saves it); then this build must come up at about 720 x its fitted height. A fixed row of one app gives a fitted height of 330 (the minimum).
    if: inputs.release_tag == '' && inputs.set_code == ''
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Window size after an old run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force C:\ftest\www\setup\manifest, C:\ftest\out | Out-Null
          go build -o C:\ftest\www\fakeapp.exe ./tools/fakeapp
          go build -o C:\ftest\testserver.exe ./tools/testserver
          go build -ldflags='-H=windowsgui' -o C:\ftest\new.exe .
          gh release download v0.2.0 --repo ${{ github.repository }} --pattern 'Fileion-Installer.exe' --dir C:\ftest\rel
          Copy-Item C:\ftest\rel\Fileion-Installer.exe C:\ftest\old.exe
          & "$env:ProgramFiles\Git\usr\bin\openssl.exe" req -x509 -newkey rsa:2048 -nodes -keyout C:\ftest\key.pem -out C:\ftest\cert.pem -days 1 -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" 2>$null
          certutil -addstore -f Root C:\ftest\cert.pem | Out-Null
          $sha = (Get-FileHash C:\ftest\www\fakeapp.exe -Algorithm SHA256).Hash.ToLower()
          $a = @{ id = 3; name = 'Test Hang'; version = '1.0'; min_version = '1.0'; url = 'https://127.0.0.1:8443/fakeapp.exe'; sha256 = $sha; installer_type = 'exe'; architecture = 'x64'
                  silent_switch = '/HANG'; product_code = '{FILEION-TEST-3}'; winget_id = 'Test.3'; page = 'https://software.fileion.com/test-3' }
          @{ code = 'cccc3333'; os = 'windows'; apps = @($a) } | ConvertTo-Json -Depth 5 | Set-Content C:\ftest\www\setup\manifest\cccc3333 -Encoding utf8
          $b = $a.Clone(); $b.id = 1; $b.name = 'Test Install'; $b.silent_switch = '/S /CODE={FILEION-TEST-1}'; $b.product_code = '{FILEION-TEST-1}'; $b.winget_id = 'Test.1'
          @{ code = 'aaaa1111'; os = 'windows'; apps = @($b) } | ConvertTo-Json -Depth 5 | Set-Content C:\ftest\www\setup\manifest\aaaa1111 -Encoding utf8
          Start-Process C:\ftest\testserver.exe -ArgumentList '-addr','127.0.0.1:8443','-dir','C:\ftest\www','-cert','C:\ftest\cert.pem','-key','C:\ftest\key.pem' -RedirectStandardError C:\ftest\out\server.log -WindowStyle Hidden
          Start-Sleep 3
          Add-Type -AssemblyName System.Drawing
          Add-Type -TypeDefinition @"
          using System; using System.Text; using System.Runtime.InteropServices;
          public class W {
            public delegate bool CB(IntPtr h, IntPtr l);
            [DllImport("user32.dll")] static extern bool EnumWindows(CB cb, IntPtr l);
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] static extern int GetWindowText(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll")] static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll")] static extern bool GetWindowRect(IntPtr h, out RECT r);
            [DllImport("user32.dll")] static extern bool SetWindowPos(IntPtr h, IntPtr a, int x, int y, int w, int hh, uint f);
            [DllImport("user32.dll")] static extern bool PostMessage(IntPtr h, uint m, IntPtr w, IntPtr l);
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int L, T, R, B; }
            public static IntPtr Find(string t) { IntPtr f = IntPtr.Zero; EnumWindows((h, l) => { if (IsWindowVisible(h)) { var s = new StringBuilder(256); GetWindowText(h, s, 256); if (s.ToString().StartsWith(t)) { f = h; return false; } } return true; }, IntPtr.Zero); return f; }
            public static int[] Size(IntPtr h) { RECT r; GetWindowRect(h, out r); return new int[] { r.R - r.L, r.B - r.T }; }
            public static int[] Rect(IntPtr h) { RECT r; GetWindowRect(h, out r); return new int[] { r.L, r.T, r.R, r.B }; }
            public static void Big(IntPtr h) { SetWindowPos(h, IntPtr.Zero, 0, 0, 1500, 1000, 0x14); }
            public static void Close(IntPtr h) { PostMessage(h, 0x10, IntPtr.Zero, IntPtr.Zero); }
          }
          "@
          $rows = @(); $fail = $false
          function Run-Window($exe, [bool]$big) {
            $p = Start-Process $exe -ArgumentList '-base','https://127.0.0.1:8443','-code','cccc3333','-no-report' -PassThru
            $h = [IntPtr]::Zero
            for ($i = 0; $i -lt 40 -and $h -eq [IntPtr]::Zero; $i++) { Start-Sleep 1; $h = [W]::Find('Fileion Installer') }
            $size = $null
            if ($h -ne [IntPtr]::Zero) {
              Start-Sleep 4   # the page lays itself out and fits the window
              $size = [W]::Size($h)
              if ($big) { [W]::Big($h); Start-Sleep 2; [W]::Close($h); Start-Sleep 4 }   # the window closes the way a person closes it: Edge saves its size
            }
            taskkill /T /F /PID $p.Id | Out-Null
            Get-Process msedge -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep 2
            $size
          }
          $s1 = Run-Window C:\ftest\old.exe $true      # v0.2.0: normal size, then a big window is closed
          $s2 = Run-Window C:\ftest\old.exe $false     # v0.2.0 again: Edge restores the big one (the reported bug, shown so the check below means something)
          $s3 = Run-Window C:\ftest\new.exe $false     # this build: its own Edge profile
          # real-window screenshots of this build (Edge's own frame, the real font): running (an installer that hangs) and finished (one that ends)
          function Shot($code, $name, $wait) {
            $p = Start-Process C:\ftest\new.exe -ArgumentList '-base','https://127.0.0.1:8443','-code',$code,'-no-report' -PassThru
            $h = [IntPtr]::Zero
            for ($i = 0; $i -lt 40 -and $h -eq [IntPtr]::Zero; $i++) { Start-Sleep 1; $h = [W]::Find('Fileion Installer') }
            Start-Sleep $wait
            if ($h -ne [IntPtr]::Zero) {
              $r = [W]::Rect($h); $bmp = New-Object System.Drawing.Bitmap ($r[2] - $r[0]), ($r[3] - $r[1])
              $g = [System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($r[0], $r[1], 0, 0, $bmp.Size); $bmp.Save("C:\ftest\out\$name.png"); $g.Dispose(); $bmp.Dispose()
            }
            taskkill /T /F /PID $p.Id | Out-Null
            Get-Process msedge -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep 2
          }
          Shot 'cccc3333' 'window-running' 8
          Shot 'aaaa1111' 'window-finished' 14
          "v0.2.0 first run: $($s1 -join ' x '), v0.2.0 after a big window was saved: $($s2 -join ' x '), this build: $($s3 -join ' x ')" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          if (-not $s3 -or [Math]::Abs($s3[0] - 720) -gt 24 -or [Math]::Abs($s3[1] - 330) -gt 24) { Write-Error "window is $($s3 -join ' x '), want about 720 x 330"; exit 1 }
      - name: Keep the window screenshots
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: window-screenshots
          path: C:\ftest\out\window-*.png
          if-no-files-found: warn

  wait-detect:
    # the friend-PC bug: Notepad++ and VLC stayed on "Installing" although they were installed. A fresh build runs the real vendor installers
    # (x64, also on the Windows 11 ARM runner, where the x64 exe runs under emulation) and must finish with the app detected, in a sane time.
    if: inputs.release_tag == '' && inputs.set_code == '' && !inputs.only_installer
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build the x64 installer (the shipped one) and the test server, trust a certificate, write the manifest
        run: |
          New-Item -ItemType Directory -Force C:\ftest\www\setup\manifest, C:\ftest\out | Out-Null
          $env:GOOS = 'windows'; $env:GOARCH = 'amd64'
          go build -ldflags='-H=windowsgui' -o C:\ftest\Fileion-Wait-and-1-more-bbbb8888.exe .
          go build -o C:\ftest\testserver.exe ./tools/testserver
          & "$env:ProgramFiles\Git\usr\bin\openssl.exe" req -x509 -newkey rsa:2048 -nodes -keyout C:\ftest\key.pem -out C:\ftest\cert.pem -days 1 -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" 2>$null
          certutil -addstore -f Root C:\ftest\cert.pem | Out-Null
          function App($id, $name, $ver, $code, $url, $hash) {
            @{ id = $id; name = $name; version = $ver; min_version = $ver; url = $url; sha256 = $hash; installer_type = 'nullsoft'; architecture = 'x64'; silent_switch = '/S'; product_code = $code; winget_id = "Test.W$id"; page = "https://software.fileion.com/test-w$id" }
          }
          $apps = @(
            (App 1 'Notepad++' '8.9.9.1' 'Notepad++' 'https://github.com/notepad-plus-plus/notepad-plus-plus/releases/download/v8.9.9.1/npp.8.9.9.1.Installer.x64.exe' 'ce3267f5c4e7e42f847e00f4b20234da6150647203033cdde34a69593efc3152'),
            (App 2 'VLC media player' '3.0.24' 'VLC media player' 'https://download.videolan.org/pub/videolan/vlc/3.0.24/win64/vlc-3.0.24-win64.exe' 'd711e1e1fe52052748c39080c7dce63f6b7e4c315efedf1774a3f1957b782ff3'))
          @{ code = 'bbbb8888'; os = 'windows'; apps = $apps } | ConvertTo-Json -Depth 5 | Set-Content C:\ftest\www\setup\manifest\bbbb8888 -Encoding utf8
      - name: Install both through the installer and check it comes back
        run: |
          Start-Process C:\ftest\testserver.exe -ArgumentList '-addr','127.0.0.1:8443','-dir','C:\ftest\www','-cert','C:\ftest\cert.pem','-key','C:\ftest\key.pem' -RedirectStandardError C:\ftest\out\server.log -WindowStyle Hidden
          Start-Sleep 3
          $ErrorActionPreference = 'Continue'
          # A GUI program: `&` does not wait for it and gives no exit code, so every run goes through Start-Process -Wait with its output in files
          function Inst($exe, [string[]]$a) {
            $o = 'C:\ftest\out\_o.txt'; $e = 'C:\ftest\out\_e.txt'
            Remove-Item $o, $e -ErrorAction SilentlyContinue
            $p = Start-Process -FilePath $exe -ArgumentList $a -Wait -PassThru -RedirectStandardOutput $o -RedirectStandardError $e -WindowStyle Hidden
            $script:LASTEXIT = $p.ExitCode
            (Get-Content $o -Raw -ErrorAction SilentlyContinue) + (Get-Content $e -Raw -ErrorAction SilentlyContinue)
          }
          $env:FILEION_INSTALLER_ELEVATED = '1'
          $rows = @(); $fail = @()
          function Check($name, $ok, $detail) { $script:rows += "| $name | $(if ($ok) {'PASS'} else {'FAIL'}) | $detail |"; if (-not $ok) { $script:fail += $name } }
          $log = "$env:TEMP\fileion-installer.log"; Remove-Item $log -ErrorAction SilentlyContinue
          $arch = (Get-CimInstance Win32_Processor).Architecture  # 9 = x64, 12 = ARM64
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $out = Inst C:\ftest\Fileion-Wait-and-1-more-bbbb8888.exe @('-base','https://127.0.0.1:8443','-no-window','-no-report','-app-timeout','15m'); $c1 = $script:LASTEXIT
          $sw.Stop()
          $out | Set-Content C:\ftest\out\wait1.txt; Copy-Item $log C:\ftest\out\wait1.log -ErrorAction SilentlyContinue
          $lg = Get-Content $log -Raw -ErrorAction SilentlyContinue
          $doneN = ([regex]::Matches($out, '\sdone\s')).Count
          Check "both installed, run returned (processor $arch)" ($c1 -eq 0 -and $doneN -eq 2) "exit $c1, done: $doneN of 2, $([int]$sw.Elapsed.TotalSeconds) s"
          Check 'the run did not wait for the time limit' ($sw.Elapsed.TotalMinutes -lt 10) "$([int]$sw.Elapsed.TotalSeconds) s of 900"
          Check 'the log has the exit code or the detection for Notepad++' ($lg -match 'Notepad\+\+: installer exited after' -or $lg -match 'Notepad\+\+: detected as installed') (($lg -split "`n" | Select-String 'Notepad\+\+|VLC' | Select-Object -Last 6) -join ' // ')
          $out = Inst C:\ftest\Fileion-Wait-and-1-more-bbbb8888.exe @('-base','https://127.0.0.1:8443','-no-window','-no-report')
          Check 'second run skips both' (([regex]::Matches($out, 'up-to-date')).Count -eq 2) 're-run'
          "### Wait-detect cases ($env:RUNNER_ARCH / ${{ matrix.os }})`n| Case | Result | Detail |`n|---|---|---|`n$($rows -join "`n")" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          Get-Process | Sort-Object CPU -Descending | Select-Object -First 15 Name, Id, CPU | Format-Table | Out-String | Set-Content C:\ftest\out\processes-after.txt
          if ($fail.Count) { Write-Error "Failed: $($fail -join '; ')"; exit 1 }
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        if: always()
        with:
          name: wait-detect-${{ matrix.os }}
          path: C:\ftest\out\

  vendor:
    # the PUBLISHED exe, the workflow's own test manifest server, three real vendor installers: no production traffic at all
    if: inputs.release_tag != '' && inputs.set_code == ''
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
