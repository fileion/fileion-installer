          $pw = ConvertTo-SecureString 'Fileion-Test-9x!' -AsPlainText -Force
          New-LocalUser -Name ftestuser -Password $pw -AccountNeverExpires | Out-Null
          New-Item -ItemType Directory -Force C:\ftest\tmp | Out-Null
          icacls C:\ftest /grant 'ftestuser:(OI)(CI)F' /T | Out-Null
          $cred = New-Object Management.Automation.PSCredential('ftestuser', $pw)
          $env:TEMP = 'C:\ftest\tmp'; $env:TMP = 'C:\ftest\tmp'
          $before = @(Keys)
          $p = Start-Process $exe -ArgumentList '-no-window', '-no-report' -Credential $cred -WorkingDirectory C:\ftest -RedirectStandardOutput C:\ftest\out\live4.txt -RedirectStandardError C:\ftest\out\live4.err -PassThru -WindowStyle Hidden -ErrorAction Continue
          $done = $p -and $p.WaitForExit(90000)
          if ($p -and -not $done) { taskkill /T /F /PID $p.Id | Out-Null }
          $o = Get-Content C:\ftest\out\live4.txt -Raw -ErrorAction SilentlyContinue
          Check 'standard user: says admin rights are needed, nothing installed' ($done -and $o -match 'Administrator rights are needed to install apps, so nothing was installed\.' -and $p.ExitCode -eq 1 -and @(Keys).Count -eq $before.Count) "finished: $done, exit $(if ($p) {$p.ExitCode})"
          $env:TEMP = $env:RUNNER_TEMP

          "### Live cases (release ${{ inputs.release_tag }}, set $env:CODE)`n| Case | Result | Detail |`n|---|---|---|`n$($rows -join "`n")" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          if ($fail.Count) { Write-Error "Failed: $($fail -join '; ')"; exit 1 }
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        if: always()
        with:
          name: live-cases
          path: C:\ftest\out\
  plan:
    if: inputs.release_tag == '' && !inputs.only_installer
    runs-on: ubuntu-24.04
    outputs:
      apps: ${{ steps.list.outputs.apps }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: list
        env:
          APPS: ${{ inputs.apps }}
        run: |
          if [ -z "$APPS" ]; then
            APPS=$(grep -v '^#' testlist/type-default.tsv | jq -Rsc 'split("\n")[1:] | map(select(length>0) | split("\t") | {name: (.[0] + " " + .[4]), url: .[1], sha256: .[2], type: .[3], switch: .[5], timeout: 600})')
          fi
          echo "apps=$APPS" >> "$GITHUB_OUTPUT"
  type-default:
    needs: plan
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
    defaults:
      run:
        shell: pwsh
    env:
      APP_NAME: ${{ matrix.app.name }}
      APP_URL: ${{ matrix.app.url }}
      APP_SHA256: ${{ matrix.app.sha256 }}
      APP_SWITCH: ${{ matrix.app.switch }}
      APP_TIMEOUT: ${{ matrix.app.timeout }}
      APP_TYPE: ${{ matrix.app.type }}
    steps:
      - name: Download, check the SHA-256, install silently, look in the Uninstall registry
        run: |
          # "hive|key name|DisplayName|DisplayVersion|Publisher" for every Uninstall entry: HKLM 64-bit, HKLM 32-bit (WOW6432Node), HKCU
          function Entries {
            foreach ($h in @(@('HKLM64', 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall'), @('HKLM32', 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall'), @('HKCU', 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall'))) {
              Get-ItemProperty "$($h[1])\*" -ErrorAction SilentlyContinue | Where-Object DisplayName | ForEach-Object { "$($h[0])|$($_.PSChildName)|$($_.DisplayName)|$($_.DisplayVersion)|$($_.Publisher)" }
            }
          }
          # Skip on the runner: the GitHub Windows image already has Git for Windows installed (and a Git process can be running), so its installer exits 1 there.
          # That is the runner, not the installer. The step lists the existing Uninstall entry instead, read-only, so the key name is still recorded.
          if ($env:APP_NAME -match '^Git x(64|86)') {
            $existing = @(Entries | Where-Object { ($_ -split '\|')[2] -eq 'Git' })
            New-Item -ItemType Directory -Force out | Out-Null
            [ordered]@{ name = $env:APP_NAME; url = $env:APP_URL; skipped = 'Git is preinstalled on the runner image'; pass = $true; new_uninstall_entries = @(); existing_uninstall_entries = $existing } | ConvertTo-Json -Depth 4 | Set-Content out\result.json
            "| $($env:APP_NAME) | SKIPPED (preinstalled on the runner) | existing entries: $($existing -join ' ; ') |" | Add-Content $env:GITHUB_STEP_SUMMARY
            exit 0
          }
          $file = Join-Path $env:RUNNER_TEMP 'installer-file.exe'
          # Same rewrite as run.DirectURL in the installer: a SourceForge /download page becomes the direct mirror link
          $url = $env:APP_URL
          if ($url -match '^https://(www\.)?sourceforge\.net/projects/([^/]+)/files/(.+?)(/download)?/?$') { $url = "https://downloads.sourceforge.net/project/$($Matches[2])/$($Matches[3])" }
          # curl.exe streams to the file: Invoke-WebRequest -PassThru kept the whole body in memory and died with "Insufficient memory" on the 1 GB+ downloads (Android Studio, 0 A.D)
          $meta = (curl.exe -sSL --fail --retry 3 --retry-delay 5 -A 'Fileion-Installer' -o $file -w '%{url_effective}|%{content_type}' $url) -split '\|', 2
          if ($LASTEXITCODE -ne 0) { Write-Error "download failed (curl exit $LASTEXITCODE) from $url"; exit 1 }
          $actual = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          $hashOk = $actual -eq $env:APP_SHA256.ToLower()
          $received = [ordered]@{ final_url = $meta[0]; content_type = $meta[1]; size = (Get-Item $file).Length }
          $before = @(Entries)
          $timedOut = $false; $exit = $null; $sw = [Diagnostics.Stopwatch]::StartNew()
          if ($hashOk) {
            $limit = if ($env:APP_TIMEOUT) { [int]$env:APP_TIMEOUT } else { 300 }
            if ($env:APP_TYPE -in 'msi', 'wix') { $exe = 'msiexec'; $argv = "/i `"$file`" $env:APP_SWITCH" } else { $exe = $file; $argv = $env:APP_SWITCH }
            $p = if ($argv) { Start-Process $exe -ArgumentList $argv -PassThru -WindowStyle Hidden } else { Start-Process $exe -PassThru -WindowStyle Hidden }
            if (-not $p.WaitForExit($limit * 1000)) { $timedOut = $true; taskkill /T /F /PID $p.Id | Out-Null } else { $exit = $p.ExitCode }
            Start-Sleep 5
          }
          $sw.Stop()
          $new = @(Entries | Where-Object { $before -notcontains $_ })
          $pass = $hashOk -and (-not $timedOut) -and ($exit -in 0, 3010) -and $new.Count -gt 0
          $result = [ordered]@{ name = $env:APP_NAME; url = $env:APP_URL; sha256_expected = $env:APP_SHA256; sha256_actual = $actual; sha256_match = $hashOk; received = $received
            switch = $env:APP_SWITCH; exit_code = $exit; timed_out = $timedOut; seconds = [int]$sw.Elapsed.TotalSeconds
            shows_in_uninstall_registry = ($new.Count -gt 0); new_uninstall_entries = $new; pass = $pass }
          New-Item -ItemType Directory -Force out | Out-Null
          $result | ConvertTo-Json -Depth 4 | Set-Content out\result.json
          "| $($env:APP_NAME) | $(if ($pass) {'PASS'} else {'FAIL'}) | SHA-256 match: $hashOk | exit: $exit | timed out: $timedOut | Uninstall entries added: $($new.Count) |" | Add-Content $env:GITHUB_STEP_SUMMARY
          if (-not $pass) { exit 1 }
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        if: always()
        with:
          name: result-${{ strategy.job-index }}
          path: out/result.json
          if-no-files-found: warn
  report:
    needs: type-default
    if: always() && inputs.release_tag == '' && !inputs.only_installer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: result-*
          path: results
          merge-multiple: false
      - run: |
          jq -s '.' results/*/result.json > all-results.json
          # one line per new Uninstall entry: app, hive, key name, DisplayName, DisplayVersion
          { printf 'app\thive\tkey\tdisplay_name\tdisplay_version\tpublisher\n'; jq -r '.[] | .name as $n | .new_uninstall_entries[]? | [$n] + split("|") | @tsv' all-results.json; } > uninstall-keys.tsv
          # entries that were already on the runner (a skipped app), listed read-only
          jq -r '.[] | select(.existing_uninstall_entries) | .name as $n | .existing_uninstall_entries[] | [$n + " (already on runner)"] + split("|") | @tsv' all-results.json >> uninstall-keys.tsv
          cat uninstall-keys.tsv >> "$GITHUB_STEP_SUMMARY"
          jq -r '.[] | [.name, (if .pass then "PASS" else "FAIL" end), (.seconds|tostring) + "s", (.new_uninstall_entries | join(" ; "))] | @tsv' all-results.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: type-default-results
          path: |
            all-results.json
            uninstall-keys.tsv
