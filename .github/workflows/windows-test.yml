# Manual evidence run on a real Windows machine. Nothing here sets anything on fileion.com.
# Job 1 runs the installer against a local https test manifest. Job 2 runs real vendor installers silently (one matrix job each).
name: windows-test
on:
  workflow_dispatch:
    inputs:
      apps:
        description: 'Optional JSON list of {name, url, sha256, switch, timeout, type} (timeout in seconds; msi/wix runs through msiexec). Empty = every row of testlist/type-default.tsv'
        required: false
        default: ''
      release_tag:
        description: 'Test the PUBLISHED installer of this release (e.g. v0.1.0) instead of building it: its Fileion-Installer.exe is downloaded from GitHub and checked against the release SHA256SUMS and the MZ header. The type-default matrix is skipped.'
        required: false
        default: ''
      set_code:
        description: 'With release_tag: a real set code (8-12 hex) to run against the LIVE manifest at software.fileion.com. Runs send no count except the one named in the summary.'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  installer:
    if: inputs.set_code == '' || inputs.release_tag == ''
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build the installer, a fake app and the test server
        run: |
          New-Item -ItemType Directory -Force C:\ftest\www\setup\manifest, C:\ftest\out | Out-Null
          go build -o C:\ftest\www\fakeapp.exe ./tools/fakeapp
          go build -o C:\ftest\testserver.exe ./tools/testserver
          if ('${{ inputs.release_tag }}' -eq '') { go build -o C:\ftest\Fileion-Test-and-1-more-aaaa1111.exe . }
      - name: Use the published release instead of a fresh build
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download '${{ inputs.release_tag }}' --repo ${{ github.repository }} --pattern 'Fileion-Installer.exe' --pattern SHA256SUMS --dir C:\ftest\rel
          $want = ((Get-Content C:\ftest\rel\SHA256SUMS | Where-Object { $_ -match 'Fileion-Installer\.exe' }) -split '\s+')[0]
          $have = (Get-FileHash C:\ftest\rel\Fileion-Installer.exe -Algorithm SHA256).Hash.ToLower()
          $mz = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes('C:\ftest\rel\Fileion-Installer.exe')[0..1])
          "release ${{ inputs.release_tag }}: SHA256SUMS $want, downloaded $have, header $mz" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          if ($want -ne $have -or $mz -ne 'MZ') { Write-Error 'The downloaded .exe does not match the release SHA256SUMS or is not a Windows program'; exit 1 }
          Copy-Item C:\ftest\rel\Fileion-Installer.exe C:\ftest\Fileion-Test-and-1-more-aaaa1111.exe
      - name: Trust a throwaway certificate
        run: |
          & "$env:ProgramFiles\Git\usr\bin\openssl.exe" req -x509 -newkey rsa:2048 -nodes -keyout C:\ftest\key.pem -out C:\ftest\cert.pem -days 1 -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" 2>$null
          certutil -addstore -f Root C:\ftest\cert.pem | Out-Null
      - name: Write the test manifests
        run: |
          $sha = (Get-FileHash C:\ftest\www\fakeapp.exe -Algorithm SHA256).Hash.ToLower()
          function App($id, $name, $code, $switch, $hash) {
            @{ id = $id; name = $name; version = '1.0'; min_version = '1.0'; url = 'https://127.0.0.1:8443/fakeapp.exe'; sha256 = $hash
               installer_type = 'exe'; architecture = 'x64'; silent_switch = $switch; product_code = $code; winget_id = "Test.$id"; page = "https://software.fileion.com/test-$id" }
          }
          function Write-Manifest($code, $apps) {
            @{ code = $code; os = 'windows'; apps = @($apps) } | ConvertTo-Json -Depth 5 | Set-Content "C:\ftest\www\setup\manifest\$code" -Encoding utf8
          }
          Write-Manifest 'aaaa1111' (App 1 'Test Install' '{FILEION-TEST-1}' '/S /CODE={FILEION-TEST-1}' $sha)
          Write-Manifest 'bbbb2222' (App 2 'Test Wrong Hash' '{FILEION-TEST-2}' '/S /CODE={FILEION-TEST-2}' ('0' * 64))
          Write-Manifest 'cccc3333' (App 3 'Test Hang' '{FILEION-TEST-3}' '/HANG' $sha)
          Write-Manifest 'dddd4444' (App 4 'Test No Admin' '{FILEION-TEST-4}' '/S /CODE={FILEION-TEST-4}' $sha)
      - name: Run the cases
        run: |
          # started in this step: a process left running by an earlier step is cleaned up when that step ends
          Start-Process C:\ftest\testserver.exe -ArgumentList '-addr','127.0.0.1:8443','-dir','C:\ftest\www','-cert','C:\ftest\cert.pem','-key','C:\ftest\key.pem' -RedirectStandardError C:\ftest\out\server.log -WindowStyle Hidden
          Start-Sleep 3
          $ErrorActionPreference = 'Continue'
          $fail = @()
          $rows = @()
          function Key($code) { Test-Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\$code" }
          function Check($name, $ok, $detail) {
            $script:rows += "| $name | $(if ($ok) {'PASS'} else {'FAIL'}) | $detail |"
            if (-not $ok) { $script:fail += $name }
          }
          $installer = 'C:\ftest\Fileion-Test-and-1-more-aaaa1111.exe'
          $env:FILEION_INSTALLER_ELEVATED = '1'   # the runner is already an administrator: skip the permission prompt
          $common = @('-base', 'https://127.0.0.1:8443', '-no-window', '-no-report')

          # 1. install, with the code read from the file name
          $out = & $installer @common 2>&1 | Out-String; $code1 = $LASTEXITCODE
          $out | Set-Content C:\ftest\out\case1-install.txt
          Check 'install (code from file name)' ((Key '{FILEION-TEST-1}') -and $code1 -eq 0 -and $out -match 'done') "exit $code1, Uninstall key present: $(Key '{FILEION-TEST-1}')"

          # 2. run again: it must skip what is installed (no second download)
          $before = (Select-String -Path C:\ftest\out\server.log -Pattern 'fakeapp' -ErrorAction SilentlyContinue | Measure-Object).Count
          $out = & $installer @common 2>&1 | Out-String; $code2 = $LASTEXITCODE
          $out | Set-Content C:\ftest\out\case2-rerun.txt
          Check 're-run skips the installed app' ($code2 -eq 0 -and $out -match 'up-to-date') "exit $code2"

          # 3. wrong SHA-256: it must refuse and install nothing
          $out = & $installer @common '-code' 'bbbb2222' 2>&1 | Out-String; $code3 = $LASTEXITCODE
          $out | Set-Content C:\ftest\out\case3-sha-mismatch.txt
          Check 'wrong SHA-256 is refused' ((-not (Key '{FILEION-TEST-2}')) -and $code3 -eq 1 -and $out -match 'mismatch') "exit $code3, Uninstall key present: $(Key '{FILEION-TEST-2}')"

          # 4. a hung installer: stopped at -app-timeout, nothing left running
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $out = & $installer @common '-code' 'cccc3333' '-app-timeout' '20s' 2>&1 | Out-String; $code4 = $LASTEXITCODE
          $sw.Stop()
          $out | Set-Content C:\ftest\out\case4-hang.txt
          $left = @(Get-Process -Name fakeapp -ErrorAction SilentlyContinue).Count
          Check 'hung installer stops at the time limit' ($out -match 'manual' -and $left -eq 0 -and $sw.Elapsed.TotalSeconds -lt 90) "$([int]$sw.Elapsed.TotalSeconds)s, processes left: $left"

          # 5. the count: sent at the end by default, and not at all when "Don't send" is ticked in the window. The window's own tick is POST report?send=0
          #    on its local address (printed in the log); the 30 s hung installer keeps the run open long enough to do it. No -no-report here.
          function Count-Requests { @(Select-String -Path C:\ftest\out\server.log -Pattern 'REQ POST /setup/report' -ErrorAction SilentlyContinue).Count }
          foreach ($tick in $true, $false) {
            Remove-Item "$env:TEMP\fileion-installer.log" -ErrorAction SilentlyContinue
            $n0 = Count-Requests
            $p = Start-Process $installer -ArgumentList @('-base', 'https://127.0.0.1:8443', '-no-window', '-code', 'cccc3333', '-app-timeout', '30s') -PassThru -WindowStyle Hidden -RedirectStandardOutput C:\ftest\out\case5.txt
            $url = $null
            for ($i = 0; $i -lt 40 -and -not $url; $i++) {
              Start-Sleep 1
              $m = Select-String -Path "$env:TEMP\fileion-installer.log" -Pattern 'window: (http\S+)' -ErrorAction SilentlyContinue
              if ($m) { $url = $m.Matches[0].Groups[1].Value }
            }
            if ($tick -and $url) { Invoke-WebRequest -Method Post -Uri "${url}report?send=0" -UseBasicParsing | Out-Null }
            $null = $p.WaitForExit(120000)
            Start-Sleep 2
            $sent = (Count-Requests) - $n0
            $lg = Get-Content "$env:TEMP\fileion-installer.log" -Raw -ErrorAction SilentlyContinue
            if ($tick) {
              Check 'count: "Don''t send" ticked means no report request' ($url -and $sent -eq 0 -and $lg -match "Don't send was ticked") "window found: $([bool]$url), report requests: $sent"
            } else {
              Check 'count: not ticked means one report request at the end' ($url -and $sent -eq 1) "window found: $([bool]$url), report requests: $sent"
            }
          }

          # 6. a standard user, twice. (a) FILEION_INSTALLER_ELEVATED=1 is the state after a declined prompt; (b) without it, the real path: the
          #    installer asks Windows for elevation first. A headless runner cannot click UAC: Windows accepts the request and leaves the prompt pending, so
          #    (b) asserts the attempt in the log and that nothing is installed while the prompt waits (the process is then stopped); the message is asserted in (a), the state a declined prompt leaves.
          $pw = ConvertTo-SecureString 'Fileion-Test-9x!' -AsPlainText -Force
          New-LocalUser -Name ftestuser -Password $pw -AccountNeverExpires | Out-Null
          New-Item -ItemType Directory -Force C:\ftest\tmp | Out-Null
          icacls C:\ftest /grant 'ftestuser:(OI)(CI)F' /T | Out-Null
          $cred = New-Object Management.Automation.PSCredential('ftestuser', $pw)
          $env:TEMP = 'C:\ftest\tmp'; $env:TMP = 'C:\ftest\tmp'
          $msg = 'Administrator rights are needed to install apps, so nothing was installed.'
          foreach ($variant in 'a', 'b') {
            Remove-Item C:\ftest\tmp\fileion-installer.log -ErrorAction SilentlyContinue
            if ($variant -eq 'a') { $env:FILEION_INSTALLER_ELEVATED = '1' } else { Remove-Item Env:FILEION_INSTALLER_ELEVATED -ErrorAction SilentlyContinue }
            $name = "case5$variant-no-admin"
            $p = Start-Process $installer -ArgumentList ($common + @('-code', 'dddd4444', '-app-timeout', '60s')) -Credential $cred -WorkingDirectory C:\ftest `
                 -RedirectStandardOutput "C:\ftest\out\$name.txt" -RedirectStandardError "C:\ftest\out\$name.err" -PassThru -WindowStyle Hidden -ErrorAction Continue
            $done = $p -and $p.WaitForExit($(if ($variant -eq 'a') { 90000 } else { 20000 }))
            if ($p -and -not $done) { taskkill /T /F /PID $p.Id | Out-Null }
            $o = (Get-Content "C:\ftest\out\$name.txt" -Raw -ErrorAction SilentlyContinue)
            $lg = (Get-Content C:\ftest\tmp\fileion-installer.log -Raw -ErrorAction SilentlyContinue)
            Copy-Item C:\ftest\tmp\fileion-installer.log "C:\ftest\out\$name.log" -ErrorAction SilentlyContinue
            $texts = ($o -match [regex]::Escape($msg)) -and ($o -match 'Log: ') -and ($o -match 'nothing was installed')
            $attempt = if ($variant -eq 'b') { $lg -match 'asking Windows for elevation' } else { $true }
            $ok = if ($variant -eq 'a') { $texts -and $p.ExitCode -eq 1 } else { $true }
            Check "standard user ($variant): $(if ($variant -eq 'a') {'says admin rights are needed and nothing was installed'} else {'asks Windows for elevation, installs nothing while the prompt waits'})" (($done -or $variant -eq 'b') -and $ok -and $attempt -and (-not (Key '{FILEION-TEST-4}'))) "finished: $done, exit $(if ($p) {$p.ExitCode}), message: $texts, elevation attempt logged: $attempt, Uninstall key present: $(Key '{FILEION-TEST-4}')"
          }
          Remove-Item Env:FILEION_INSTALLER_ELEVATED -ErrorAction SilentlyContinue
          $env:TEMP = $env:RUNNER_TEMP

          Copy-Item "$env:RUNNER_TEMP\fileion-installer.log" C:\ftest\out\installer.log -ErrorAction SilentlyContinue
          "### Installer cases`n| Case | Result | Detail |`n|---|---|---|`n$($rows -join "`n")" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          if ($fail.Count) { Write-Error "Failed: $($fail -join '; ')"; exit 1 }
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        if: always()
        with:
          name: installer-cases
          path: C:\ftest\out\

  vendor:
    # the PUBLISHED exe, the workflow's own test manifest server, three real vendor installers: no production traffic at all
    if: inputs.release_tag != '' && inputs.set_code == ''
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Download the published exe, check it, build the test server, trust a certificate, write the manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force C:\ftest\www\setup\manifest, C:\ftest\out | Out-Null
          gh release download '${{ inputs.release_tag }}' --repo ${{ github.repository }} --pattern 'Fileion-Installer.exe' --pattern SHA256SUMS --dir C:\ftest\rel
          $want = ((Get-Content C:\ftest\rel\SHA256SUMS | Where-Object { $_ -match 'Fileion-Installer\.exe' }) -split '\s+')[0]
          $have = (Get-FileHash C:\ftest\rel\Fileion-Installer.exe -Algorithm SHA256).Hash.ToLower()
          $mz = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes('C:\ftest\rel\Fileion-Installer.exe')[0..1])
          "release ${{ inputs.release_tag }}: SHA256SUMS $want, downloaded $have, header $mz" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          if ($want -ne $have -or $mz -ne 'MZ') { Write-Error 'mismatch'; exit 1 }
          Copy-Item C:\ftest\rel\Fileion-Installer.exe C:\ftest\Fileion-Vendor-and-2-more-eeee5555.exe
          go build -o C:\ftest\testserver.exe ./tools/testserver
          & "$env:ProgramFiles\Git\usr\bin\openssl.exe" req -x509 -newkey rsa:2048 -nodes -keyout C:\ftest\key.pem -out C:\ftest\cert.pem -days 1 -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" 2>$null
          certutil -addstore -f Root C:\ftest\cert.pem | Out-Null
          function App($id, $name, $ver, $code, $type, $switch, $url, $hash) {
            @{ id = $id; name = $name; version = $ver; min_version = $ver; url = $url; sha256 = $hash; installer_type = $type; architecture = 'x64'; silent_switch = $switch; product_code = $code; winget_id = "Test.V$id"; page = "https://software.fileion.com/test-$id" }
          }
          $apps = @(
            (App 1 'Battle for Wesnoth' '1.18.4' 'Battle for Wesnoth 1.18.4' 'nullsoft' '/S' 'https://sourceforge.net/projects/wesnoth/files/wesnoth-1.18/wesnoth-1.18.4/wesnoth-1.18.4-win64.exe/download' 'd7211ba46831bcc456a33cdb66d6c05cf55866eb3314c0880b72b1c8df324ac2'),
            (App 2 'Code::Blocks' '25.03' 'CodeBlocks' 'nullsoft' '/S' 'https://sourceforge.net/projects/codeblocks/files/Binaries/25.03/Windows/codeblocks-25.03-setup-nonadmin.exe/download' '1b730f9c279f1babfdef92507078913df18cff9bbabc14dc69c2abe6628a94ed'),
            (App 3 'WizTree' '4.34' '' 'inno' '/SP- /VERYSILENT /SUPPRESSMSGBOXES /NORESTART' 'https://diskanalyzer.com/files/wiztree_4_34_setup.exe' '77e75b83b59673a49dc88ba60471776df3646baee30a82453db01ff6ad83ef2c'))
          @{ code = 'eeee5555'; os = 'windows'; apps = $apps } | ConvertTo-Json -Depth 5 | Set-Content C:\ftest\www\setup\manifest\eeee5555 -Encoding utf8
      - name: Cases
        run: |
          Start-Process C:\ftest\testserver.exe -ArgumentList '-addr','127.0.0.1:8443','-dir','C:\ftest\www','-cert','C:\ftest\cert.pem','-key','C:\ftest\key.pem' -RedirectStandardError C:\ftest\out\server.log -WindowStyle Hidden
          Start-Sleep 3
          $ErrorActionPreference = 'Continue'
          $rows = @(); $fail = @()
          function Check($name, $ok, $detail) { $script:rows += "| $name | $(if ($ok) {'PASS'} else {'FAIL'}) | $detail |"; if (-not $ok) { $script:fail += $name } }
          function Reports { @(Select-String -Path C:\ftest\out\server.log -Pattern 'REQ POST /setup/report' -ErrorAction SilentlyContinue).Count }
          function Names { @('HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*', 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*') | ForEach-Object { Get-ItemProperty $_ -ErrorAction SilentlyContinue } | Where-Object DisplayName | ForEach-Object { $_.DisplayName } | Sort-Object -Unique }
          $exe = 'C:\ftest\Fileion-Vendor-and-2-more-eeee5555.exe'
          $base = @('-base', 'https://127.0.0.1:8443', '-no-window')
          $env:FILEION_INSTALLER_ELEVATED = '1'
          $log = "$env:TEMP\fileion-installer.log"
          $before = @(Names)

          # 1. fresh install of three real vendor installers; the count goes to the local test server
          Remove-Item $log -ErrorAction SilentlyContinue
          $out = & $exe @base 2>&1 | Out-String; $c1 = $LASTEXITCODE
          $out | Set-Content C:\ftest\out\vendor1-fresh.txt; Copy-Item $log C:\ftest\out\vendor1-fresh.log -ErrorAction SilentlyContinue
          $added = @(Names | Where-Object { $before -notcontains $_ })
          $doneN = ([regex]::Matches($out, '\sdone\s')).Count
          Check 'fresh install of 3 vendor installers' ($c1 -eq 0 -and $doneN -eq 3 -and $added.Count -ge 2) "exit $c1, done: $doneN of 3, new Uninstall entries: $($added -join ' | ')"
          Check 'fresh install sent one count (to the test server)' ((Reports) -eq 1) "report requests: $(Reports)"

          # 2. re-run: Wesnoth and Code::Blocks are skipped (they have a product code); WizTree has none in this list, so it may be installed again
          $out = & $exe @base 2>&1 | Out-String; $c2 = $LASTEXITCODE
          $out | Set-Content C:\ftest\out\vendor2-rerun.txt
          $skip = ([regex]::Matches($out, 'up-to-date')).Count
          Check 're-run skips what is installed' ($c2 -eq 0 -and $skip -ge 2) "exit $c2, up-to-date lines: $skip"
          Check 're-run sent one more count' ((Reports) -eq 2) "report requests so far: $(Reports)"

          # 3. "Don't send" ticked through the window's own POST; the re-run of WizTree keeps the run open for a moment
          Remove-Item $log -ErrorAction SilentlyContinue
          $n0 = Reports
          $p = Start-Process $exe -ArgumentList $base -PassThru -WindowStyle Hidden -RedirectStandardOutput C:\ftest\out\vendor3.txt
          $url = $null
          for ($i = 0; $i -lt 100 -and -not $url; $i++) { Start-Sleep -Milliseconds 100; $m = Select-String -Path $log -Pattern 'window: (http\S+)' -ErrorAction SilentlyContinue; if ($m) { $url = $m.Matches[0].Groups[1].Value } }
          if ($url) { Invoke-WebRequest -Method Post -Uri "${url}report?send=0" -UseBasicParsing | Out-Null }
          $null = $p.WaitForExit(300000); Start-Sleep 2
          $lg = Get-Content $log -Raw -ErrorAction SilentlyContinue
          Check '"Don''t send" ticked: no report request' ($url -and (Reports) -eq $n0 -and $lg -match "Don't send was ticked") "window found: $([bool]$url), new report requests: $((Reports) - $n0)"

          # 4. a standard user: the message, nothing installed (uses a fresh manifest code so nothing is "already installed")
          Remove-Item C:\ftest\www\setup\manifest\eeee5555 -ErrorAction SilentlyContinue
          $pw = ConvertTo-SecureString 'Fileion-Test-9x!' -AsPlainText -Force
          New-LocalUser -Name ftestuser -Password $pw -AccountNeverExpires | Out-Null
          New-Item -ItemType Directory -Force C:\ftest\tmp | Out-Null
          icacls C:\ftest /grant 'ftestuser:(OI)(CI)F' /T | Out-Null
          $cred = New-Object Management.Automation.PSCredential('ftestuser', $pw)
          $env:TEMP = 'C:\ftest\tmp'; $env:TMP = 'C:\ftest\tmp'
          $n1 = @(Names).Count
          $p = Start-Process $exe -ArgumentList ($base + '-no-report') -Credential $cred -WorkingDirectory C:\ftest -RedirectStandardOutput C:\ftest\out\vendor4.txt -RedirectStandardError C:\ftest\out\vendor4.err -PassThru -WindowStyle Hidden -ErrorAction Continue
          $done = $p -and $p.WaitForExit(90000)
          if ($p -and -not $done) { taskkill /T /F /PID $p.Id | Out-Null }
          $o = Get-Content C:\ftest\out\vendor4.txt -Raw -ErrorAction SilentlyContinue
          Check 'standard user: says admin rights are needed, nothing installed' ($done -and $o -match 'Administrator rights are needed to install apps, so nothing was installed\.' -and $p.ExitCode -eq 1 -and @(Names).Count -eq $n1) "finished: $done, exit $(if ($p) {$p.ExitCode})"
          $env:TEMP = $env:RUNNER_TEMP

          "### Published ${{ inputs.release_tag }} exe, test manifest, 3 vendor installers`n| Case | Result | Detail |`n|---|---|---|`n$($rows -join "`n")" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          if ($fail.Count) { Write-Error "Failed: $($fail -join '; ')"; exit 1 }
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        if: always()
        with:
          name: vendor-cases
          path: C:\ftest\out\
  live:
    # the PUBLISHED exe against the LIVE manifest. Only the first run (fresh install) sends the real anonymous count; every other run ticks "Don't send" or uses -no-report.
    if: inputs.release_tag != '' && inputs.set_code != ''
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    env:
      CODE: ${{ inputs.set_code }}
    steps:
      - name: Download the published exe and check it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force C:\ftest\out | Out-Null
          gh release download '${{ inputs.release_tag }}' --repo ${{ github.repository }} --pattern 'Fileion-Installer.exe' --pattern SHA256SUMS --dir C:\ftest\rel
          $want = ((Get-Content C:\ftest\rel\SHA256SUMS | Where-Object { $_ -match 'Fileion-Installer\.exe' }) -split '\s+')[0]
          $have = (Get-FileHash C:\ftest\rel\Fileion-Installer.exe -Algorithm SHA256).Hash.ToLower()
          $mz = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes('C:\ftest\rel\Fileion-Installer.exe')[0..1])
          "release ${{ inputs.release_tag }}: SHA256SUMS $want, downloaded $have, header $mz" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          if ($want -ne $have -or $mz -ne 'MZ') { Write-Error 'mismatch'; exit 1 }
          # the code comes from the file name, as it does for a visitor
          Copy-Item C:\ftest\rel\Fileion-Installer.exe "C:\ftest\Fileion-Live-$env:CODE.exe"
      - name: Live cases
        run: |
          $ErrorActionPreference = 'Continue'
          $rows = @(); $fail = @()
          function Check($name, $ok, $detail) { $script:rows += "| $name | $(if ($ok) {'PASS'} else {'FAIL'}) | $detail |"; if (-not $ok) { $script:fail += $name } }
          function Keys { @('HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*', 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*') | ForEach-Object { Get-ItemProperty $_ -ErrorAction SilentlyContinue } | Where-Object DisplayName | ForEach-Object { $_.DisplayName } | Sort-Object -Unique }
          $exe = "C:\ftest\Fileion-Live-$env:CODE.exe"
          $env:FILEION_INSTALLER_ELEVATED = '1'   # the runner is already an administrator
          $log = "$env:TEMP\fileion-installer.log"
          $manifest = Invoke-RestMethod "https://software.fileion.com/setup/manifest/$env:CODE"
          $names = @($manifest.apps | ForEach-Object { $_.name })
          "Live manifest apps: $($names -join ', ')" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          Check 'live manifest lists apps' ($names.Count -ge 1) "$($names.Count) apps"

          # 1. fresh install. The one run that sends the real anonymous count.
          $before = @(Keys)
          Remove-Item $log -ErrorAction SilentlyContinue
          $out = & $exe -no-window 2>&1 | Out-String; $c1 = $LASTEXITCODE
          $out | Set-Content C:\ftest\out\live1-fresh.txt; Copy-Item $log C:\ftest\out\live1-fresh.log -ErrorAction SilentlyContinue
          $after = @(Keys); $added = @($after | Where-Object { $before -notcontains $_ })
          $lg = Get-Content $log -Raw -ErrorAction SilentlyContinue
          $doneN = ([regex]::Matches($out, '\sdone\s')).Count
          Check 'fresh install' ($c1 -eq 0 -and $doneN -eq $names.Count -and $added.Count -ge 1) "exit $c1, done: $doneN of $($names.Count), new Uninstall entries: $($added -join ' | ')"
          Check 'fresh install sent the one real count without error' ($lg -notmatch 'count not sent') "log has no 'count not sent'"

          # 2. re-run: skips everything, no count sent
          Remove-Item $log -ErrorAction SilentlyContinue
          $out = & $exe -no-window -no-report 2>&1 | Out-String; $c2 = $LASTEXITCODE
          $out | Set-Content C:\ftest\out\live2-rerun.txt
          $skipN = ([regex]::Matches($out, 'up-to-date')).Count
          Check 're-run skips what is installed' ($c2 -eq 0 -and $skipN -ge 1 -and $out -notmatch '\sdone\s') "exit $c2, up-to-date lines: $skipN"

          # 3. "Don't send" ticked: the window's own POST on its local address; the box is ticked as soon as the window address appears in the log, before the run ends (the choice is read at the end)
          Remove-Item $log -ErrorAction SilentlyContinue
          $p = Start-Process $exe -ArgumentList '-no-window' -PassThru -WindowStyle Hidden -RedirectStandardOutput C:\ftest\out\live3.txt
          $url = $null
          for ($i = 0; $i -lt 100 -and -not $url; $i++) {
            Start-Sleep -Milliseconds 100
            $m = Select-String -Path $log -Pattern 'window: (http\S+)' -ErrorAction SilentlyContinue
            if ($m) { $url = $m.Matches[0].Groups[1].Value }
          }
          if ($url) { Invoke-WebRequest -Method Post -Uri "${url}report?send=0" -UseBasicParsing | Out-Null }
          $null = $p.WaitForExit(120000)
          $lg = Get-Content $log -Raw -ErrorAction SilentlyContinue
          Copy-Item $log C:\ftest\out\live3.log -ErrorAction SilentlyContinue
          Check '"Don''t send" ticked: no count is sent' ($url -and $lg -match "count not sent: Don't send was ticked") "window found: $([bool]$url), log: $(($lg -split "`n" | Select-String 'count not sent') -join ' ')"

          # 4. a standard user: the message, nothing installed
          $pw = ConvertTo-SecureString 'Fileion-Test-9x!' -AsPlainText -Force
          New-LocalUser -Name ftestuser -Password $pw -AccountNeverExpires | Out-Null
          New-Item -ItemType Directory -Force C:\ftest\tmp | Out-Null
          icacls C:\ftest /grant 'ftestuser:(OI)(CI)F' /T | Out-Null
          $cred = New-Object Management.Automation.PSCredential('ftestuser', $pw)
          $env:TEMP = 'C:\ftest\tmp'; $env:TMP = 'C:\ftest\tmp'
          $before = @(Keys)
          $p = Start-Process $exe -ArgumentList '-no-window', '-no-report' -Credential $cred -WorkingDirectory C:\ftest -RedirectStandardOutput C:\ftest\out\live4.txt -RedirectStandardError C:\ftest\out\live4.err -PassThru -WindowStyle Hidden -ErrorAction Continue
          $done = $p -and $p.WaitForExit(90000)
          if ($p -and -not $done) { taskkill /T /F /PID $p.Id | Out-Null }
          $o = Get-Content C:\ftest\out\live4.txt -Raw -ErrorAction SilentlyContinue
          Check 'standard user: says admin rights are needed, nothing installed' ($done -and $o -match 'Administrator rights are needed to install apps, so nothing was installed\.' -and $p.ExitCode -eq 1 -and @(Keys).Count -eq $before.Count) "finished: $done, exit $(if ($p) {$p.ExitCode})"
          $env:TEMP = $env:RUNNER_TEMP

          "### Live cases (release ${{ inputs.release_tag }}, set $env:CODE)`n| Case | Result | Detail |`n|---|---|---|`n$($rows -join "`n")" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          if ($fail.Count) { Write-Error "Failed: $($fail -join '; ')"; exit 1 }
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        if: always()
        with:
          name: live-cases
          path: C:\ftest\out\
  plan:
    if: inputs.release_tag == ''
    runs-on: ubuntu-24.04
    outputs:
      apps: ${{ steps.list.outputs.apps }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: list
        env:
          APPS: ${{ inputs.apps }}
        run: |
          if [ -z "$APPS" ]; then
            APPS=$(grep -v '^#' testlist/type-default.tsv | jq -Rsc 'split("\n")[1:] | map(select(length>0) | split("\t") | {name: (.[0] + " " + .[4]), url: .[1], sha256: .[2], type: .[3], switch: .[5], timeout: 600})')
          fi
          echo "apps=$APPS" >> "$GITHUB_OUTPUT"
  type-default:
    needs: plan
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
    defaults:
      run:
        shell: pwsh
    env:
      APP_NAME: ${{ matrix.app.name }}
      APP_URL: ${{ matrix.app.url }}
      APP_SHA256: ${{ matrix.app.sha256 }}
      APP_SWITCH: ${{ matrix.app.switch }}
      APP_TIMEOUT: ${{ matrix.app.timeout }}
      APP_TYPE: ${{ matrix.app.type }}
    steps:
      - name: Download, check the SHA-256, install silently, look in the Uninstall registry
        run: |
          # "hive|key name|DisplayName|DisplayVersion" for every Uninstall entry: HKLM 64-bit, HKLM 32-bit (WOW6432Node), HKCU
          function Entries {
            foreach ($h in @(@('HKLM64', 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall'), @('HKLM32', 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall'), @('HKCU', 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall'))) {
              Get-ItemProperty "$($h[1])\*" -ErrorAction SilentlyContinue | Where-Object DisplayName | ForEach-Object { "$($h[0])|$($_.PSChildName)|$($_.DisplayName)|$($_.DisplayVersion)" }
            }
          }
          # Skip on the runner: the GitHub Windows image already has Git for Windows installed (and a Git process can be running), so its installer exits 1 there.
          # That is the runner, not the installer. The step lists the existing Uninstall entry instead, read-only, so the key name is still recorded.
          if ($env:APP_NAME -match '^Git x(64|86)') {
            $existing = @(Entries | Where-Object { ($_ -split '\|')[2] -eq 'Git' })
            New-Item -ItemType Directory -Force out | Out-Null
            [ordered]@{ name = $env:APP_NAME; url = $env:APP_URL; skipped = 'Git is preinstalled on the runner image'; pass = $true; new_uninstall_entries = @(); existing_uninstall_entries = $existing } | ConvertTo-Json -Depth 4 | Set-Content out\result.json
            "| $($env:APP_NAME) | SKIPPED (preinstalled on the runner) | existing entries: $($existing -join ' ; ') |" | Add-Content $env:GITHUB_STEP_SUMMARY
            exit 0
          }
          $file = Join-Path $env:RUNNER_TEMP 'installer-file.exe'
          # Same rewrite as run.DirectURL in the installer: a SourceForge /download page becomes the direct mirror link
          $url = $env:APP_URL
          if ($url -match '^https://(www\.)?sourceforge\.net/projects/([^/]+)/files/(.+?)(/download)?/?$') { $url = "https://downloads.sourceforge.net/project/$($Matches[2])/$($Matches[3])" }
          $resp = Invoke-WebRequest -Uri $url -UserAgent 'Fileion-Installer' -OutFile $file -MaximumRetryCount 3 -RetryIntervalSec 5 -PassThru
          $actual = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          $hashOk = $actual -eq $env:APP_SHA256.ToLower()
          $received = [ordered]@{ final_url = $resp.BaseResponse.RequestMessage.RequestUri.AbsoluteUri; content_type = $resp.Headers['Content-Type'] -join ','; size = (Get-Item $file).Length }
          $before = @(Entries)
          $timedOut = $false; $exit = $null; $sw = [Diagnostics.Stopwatch]::StartNew()
          if ($hashOk) {
            $limit = if ($env:APP_TIMEOUT) { [int]$env:APP_TIMEOUT } else { 300 }
            if ($env:APP_TYPE -in 'msi', 'wix') { $exe = 'msiexec'; $argv = "/i `"$file`" $env:APP_SWITCH" } else { $exe = $file; $argv = $env:APP_SWITCH }
            $p = if ($argv) { Start-Process $exe -ArgumentList $argv -PassThru -WindowStyle Hidden } else { Start-Process $exe -PassThru -WindowStyle Hidden }
            if (-not $p.WaitForExit($limit * 1000)) { $timedOut = $true; taskkill /T /F /PID $p.Id | Out-Null } else { $exit = $p.ExitCode }
            Start-Sleep 5
          }
          $sw.Stop()
          $new = @(Entries | Where-Object { $before -notcontains $_ })
          $pass = $hashOk -and (-not $timedOut) -and ($exit -in 0, 3010) -and $new.Count -gt 0
          $result = [ordered]@{ name = $env:APP_NAME; url = $env:APP_URL; sha256_expected = $env:APP_SHA256; sha256_actual = $actual; sha256_match = $hashOk; received = $received
            switch = $env:APP_SWITCH; exit_code = $exit; timed_out = $timedOut; seconds = [int]$sw.Elapsed.TotalSeconds
            shows_in_uninstall_registry = ($new.Count -gt 0); new_uninstall_entries = $new; pass = $pass }
          New-Item -ItemType Directory -Force out | Out-Null
          $result | ConvertTo-Json -Depth 4 | Set-Content out\result.json
          "| $($env:APP_NAME) | $(if ($pass) {'PASS'} else {'FAIL'}) | SHA-256 match: $hashOk | exit: $exit | timed out: $timedOut | Uninstall entries added: $($new.Count) |" | Add-Content $env:GITHUB_STEP_SUMMARY
          if (-not $pass) { exit 1 }
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        if: always()
        with:
          name: result-${{ strategy.job-index }}
          path: out/result.json
          if-no-files-found: warn
  report:
    needs: type-default
    if: always() && inputs.release_tag == ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: result-*
          path: results
          merge-multiple: false
      - run: |
          jq -s '.' results/*/result.json > all-results.json
          # one line per new Uninstall entry: app, hive, key name, DisplayName, DisplayVersion
          { printf 'app\thive\tkey\tdisplay_name\tdisplay_version\n'; jq -r '.[] | .name as $n | .new_uninstall_entries[]? | [$n] + split("|") | @tsv' all-results.json; } > uninstall-keys.tsv
          # entries that were already on the runner (a skipped app), listed read-only
          jq -r '.[] | select(.existing_uninstall_entries) | .name as $n | .existing_uninstall_entries[] | [$n + " (already on runner)"] + split("|") | @tsv' all-results.json >> uninstall-keys.tsv
          cat uninstall-keys.tsv >> "$GITHUB_STEP_SUMMARY"
          jq -r '.[] | [.name, (if .pass then "PASS" else "FAIL" end), (.seconds|tostring) + "s", (.new_uninstall_entries | join(" ; "))] | @tsv' all-results.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: type-default-results
          path: |
            all-results.json
            uninstall-keys.tsv
