          if ($want -ne $have -or $mz -ne 'MZ') { Write-Error 'mismatch'; exit 1 }
          Copy-Item C:\ftest\rel\Fileion-Installer.exe C:\ftest\Fileion-Vendor-and-2-more-eeee5555.exe
          go build -o C:\ftest\testserver.exe ./tools/testserver
          & "$env:ProgramFiles\Git\usr\bin\openssl.exe" req -x509 -newkey rsa:2048 -nodes -keyout C:\ftest\key.pem -out C:\ftest\cert.pem -days 1 -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" 2>$null
          certutil -addstore -f Root C:\ftest\cert.pem | Out-Null
          function App($id, $name, $ver, $code, $type, $switch, $url, $hash) {
            @{ id = $id; name = $name; version = $ver; min_version = $ver; url = $url; sha256 = $hash; installer_type = $type; architecture = 'x64'; silent_switch = $switch; product_code = $code; winget_id = "Test.V$id"; page = "https://software.fileion.com/test-$id" }
          }
          $apps = @(
            (App 1 'Battle for Wesnoth' '1.18.4' 'Battle for Wesnoth 1.18.4' 'nullsoft' '/S' 'https://sourceforge.net/projects/wesnoth/files/wesnoth-1.18/wesnoth-1.18.4/wesnoth-1.18.4-win64.exe/download' 'd7211ba46831bcc456a33cdb66d6c05cf55866eb3314c0880b72b1c8df324ac2'),
            (App 2 'Code::Blocks' '25.03' 'CodeBlocks' 'nullsoft' '/S' 'https://sourceforge.net/projects/codeblocks/files/Binaries/25.03/Windows/codeblocks-25.03-setup-nonadmin.exe/download' '1b730f9c279f1babfdef92507078913df18cff9bbabc14dc69c2abe6628a94ed'),
            (App 3 'WizTree' '4.34' '' 'inno' '/SP- /VERYSILENT /SUPPRESSMSGBOXES /NORESTART' 'https://diskanalyzer.com/files/wiztree_4_34_setup.exe' '77e75b83b59673a49dc88ba60471776df3646baee30a82453db01ff6ad83ef2c'))
          @{ code = 'eeee5555'; os = 'windows'; apps = $apps } | ConvertTo-Json -Depth 5 | Set-Content C:\ftest\www\setup\manifest\eeee5555 -Encoding utf8
      - name: Cases
        run: |
          Start-Process C:\ftest\testserver.exe -ArgumentList '-addr','127.0.0.1:8443','-dir','C:\ftest\www','-cert','C:\ftest\cert.pem','-key','C:\ftest\key.pem' -RedirectStandardError C:\ftest\out\server.log -WindowStyle Hidden
          Start-Sleep 3
          $ErrorActionPreference = 'Continue'
          # A GUI program: `&` does not wait for it and gives no exit code, so every run goes through Start-Process -Wait with its output in files
          function Inst($exe, [string[]]$a) {
            $o = 'C:\ftest\out\_o.txt'; $e = 'C:\ftest\out\_e.txt'
            Remove-Item $o, $e -ErrorAction SilentlyContinue
            $p = Start-Process -FilePath $exe -ArgumentList $a -Wait -PassThru -RedirectStandardOutput $o -RedirectStandardError $e -WindowStyle Hidden
            $script:LASTEXIT = $p.ExitCode
            (Get-Content $o -Raw -ErrorAction SilentlyContinue) + (Get-Content $e -Raw -ErrorAction SilentlyContinue)
          }
          $rows = @(); $fail = @()
          function Check($name, $ok, $detail) { $script:rows += "| $name | $(if ($ok) {'PASS'} else {'FAIL'}) | $detail |"; if (-not $ok) { $script:fail += $name } }
          function Reports { @(Select-String -Path C:\ftest\out\server.log -Pattern 'REQ POST /setup/report' -ErrorAction SilentlyContinue).Count }
          function Names { @('HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*', 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*') | ForEach-Object { Get-ItemProperty $_ -ErrorAction SilentlyContinue } | Where-Object DisplayName | ForEach-Object { $_.DisplayName } | Sort-Object -Unique }
          $exe = 'C:\ftest\Fileion-Vendor-and-2-more-eeee5555.exe'
          $base = @('-base', 'https://127.0.0.1:8443', '-no-window')
          $env:FILEION_INSTALLER_ELEVATED = '1'
          $log = "$env:TEMP\fileion-installer.log"
          $before = @(Names)

          # 1. fresh install of three real vendor installers; the count goes to the local test server
          Remove-Item $log -ErrorAction SilentlyContinue
          $out = Inst $exe $base; $c1 = $script:LASTEXIT
