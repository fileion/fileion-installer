          $null = $p.WaitForExit(120000)
          $lg = Get-Content $log -Raw -ErrorAction SilentlyContinue
          Copy-Item $log C:\ftest\out\live3.log -ErrorAction SilentlyContinue
          Check '"Don''t send" ticked: no count is sent' ($url -and $lg -match "count not sent: Don't send was ticked") "window found: $([bool]$url), log: $(($lg -split "`n" | Select-String 'count not sent') -join ' ')"

