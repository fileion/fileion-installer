          gh release download '${{ inputs.release_tag }}' --repo ${{ github.repository }} --pattern 'Fileion-Installer.exe' --pattern SHA256SUMS --dir C:\ftest\rel
          $want = ((Get-Content C:\ftest\rel\SHA256SUMS | Where-Object { $_ -match 'Fileion-Installer\.exe' }) -split '\s+')[0]
          $have = (Get-FileHash C:\ftest\rel\Fileion-Installer.exe -Algorithm SHA256).Hash.ToLower()
          $mz = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes('C:\ftest\rel\Fileion-Installer.exe')[0..1])
