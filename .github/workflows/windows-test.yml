          Remove-Item $log -ErrorAction SilentlyContinue
          $out = Inst $exe @('-no-window'); $c1 = $script:LASTEXIT
          $out | Set-Content C:\ftest\out\live1-fresh.txt; Copy-Item $log C:\ftest\out\live1-fresh.log -ErrorAction SilentlyContinue
          $after = @(Keys); $added = @($after | Where-Object { $before -notcontains $_ })
          $lg = Get-Content $log -Raw -ErrorAction SilentlyContinue
          $doneN = ([regex]::Matches($out, '\sdone\s')).Count
          Check 'fresh install' ($c1 -eq 0 -and $doneN -eq $names.Count -and $added.Count -ge 1) "exit $c1, done: $doneN of $($names.Count), new Uninstall entries: $($added -join ' | ')"
          Check 'fresh install sent the one real count without error' ($lg -notmatch 'count not sent') "log has no 'count not sent'"

          # 2. re-run: skips everything, no count sent
          Remove-Item $log -ErrorAction SilentlyContinue
          $out = Inst $exe @('-no-window','-no-report'); $c2 = $script:LASTEXIT
          $out | Set-Content C:\ftest\out\live2-rerun.txt
          $skipN = ([regex]::Matches($out, 'up-to-date')).Count
          Check 're-run skips what is installed' ($c2 -eq 0 -and $skipN -ge 1 -and $out -notmatch '\sdone\s') "exit $c2, up-to-date lines: $skipN"

          # 3. "Don't send" ticked: the window's own POST on its local address; the box is ticked as soon as the window address appears in the log, before the run ends (the choice is read at the end)
          Remove-Item $log -ErrorAction SilentlyContinue
          $p = Start-Process $exe -ArgumentList '-no-window' -PassThru -WindowStyle Hidden -RedirectStandardOutput C:\ftest\out\live3.txt
          $url = $null
          for ($i = 0; $i -lt 100 -and -not $url; $i++) {
