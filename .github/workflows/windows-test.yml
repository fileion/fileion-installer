          $added = @(Names | Where-Object { $before -notcontains $_ })
          $doneN = ([regex]::Matches($out, '\sdone\s')).Count
          Check 'fresh install of 3 vendor installers' ($c1 -eq 0 -and $doneN -eq 3 -and $added.Count -ge 2) "exit $c1, done: $doneN of 3, new Uninstall entries: $($added -join ' | ')"
          Check 'fresh install sent one count (to the test server)' ((Reports) -eq 1) "report requests: $(Reports)"

          # 2. re-run: Wesnoth and Code::Blocks are skipped (they have a product code); WizTree has none in this list, so it may be installed again
          $out = Inst $exe $base; $c2 = $script:LASTEXIT
          $out | Set-Content C:\ftest\out\vendor2-rerun.txt
          $skip = ([regex]::Matches($out, 'up-to-date')).Count
          Check 're-run skips what is installed' ($c2 -eq 0 -and $skip -ge 2) "exit $c2, up-to-date lines: $skip"
          Check 're-run sent one more count' ((Reports) -eq 2) "report requests so far: $(Reports)"

          # 3. "Don't send" ticked through the window's own POST; the re-run of WizTree keeps the run open for a moment
          Remove-Item $log -ErrorAction SilentlyContinue
          $n0 = Reports
          $p = Start-Process $exe -ArgumentList $base -PassThru -WindowStyle Hidden -RedirectStandardOutput C:\ftest\out\vendor3.txt
          $url = $null
          for ($i = 0; $i -lt 100 -and -not $url; $i++) { Start-Sleep -Milliseconds 100; $m = Select-String -Path $log -Pattern 'window: (http\S+)' -ErrorAction SilentlyContinue; if ($m) { $url = $m.Matches[0].Groups[1].Value } }
          if ($url) { Invoke-WebRequest -Method Post -Uri "${url}report?send=0" -UseBasicParsing | Out-Null }
          $null = $p.WaitForExit(300000); Start-Sleep 2
          $lg = Get-Content $log -Raw -ErrorAction SilentlyContinue
          Check '"Don''t send" ticked: no report request' ($url -and (Reports) -eq $n0 -and $lg -match "Don't send was ticked") "window found: $([bool]$url), new report requests: $((Reports) - $n0)"

          # 4. a standard user: the message, nothing installed (uses a fresh manifest code so nothing is "already installed")
          Remove-Item C:\ftest\www\setup\manifest\eeee5555 -ErrorAction SilentlyContinue
          $pw = ConvertTo-SecureString 'Fileion-Test-9x!' -AsPlainText -Force
          New-LocalUser -Name ftestuser -Password $pw -AccountNeverExpires | Out-Null
          New-Item -ItemType Directory -Force C:\ftest\tmp | Out-Null
          icacls C:\ftest /grant 'ftestuser:(OI)(CI)F' /T | Out-Null
          $cred = New-Object Management.Automation.PSCredential('ftestuser', $pw)
          $env:TEMP = 'C:\ftest\tmp'; $env:TMP = 'C:\ftest\tmp'
          $n1 = @(Names).Count
          $p = Start-Process $exe -ArgumentList ($base + '-no-report') -Credential $cred -WorkingDirectory C:\ftest -RedirectStandardOutput C:\ftest\out\vendor4.txt -RedirectStandardError C:\ftest\out\vendor4.err -PassThru -WindowStyle Hidden -ErrorAction Continue
          $done = $p -and $p.WaitForExit(90000)
          if ($p -and -not $done) { taskkill /T /F /PID $p.Id | Out-Null }
          $o = Get-Content C:\ftest\out\vendor4.txt -Raw -ErrorAction SilentlyContinue
          Check 'standard user: says admin rights are needed, nothing installed' ($done -and $o -match 'Administrator rights are needed to install apps, so nothing was installed\.' -and $p.ExitCode -eq 1 -and @(Names).Count -eq $n1) "finished: $done, exit $(if ($p) {$p.ExitCode})"
          $env:TEMP = $env:RUNNER_TEMP

          "### Published ${{ inputs.release_tag }} exe, test manifest, 3 vendor installers`n| Case | Result | Detail |`n|---|---|---|`n$($rows -join "`n")" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          if ($fail.Count) { Write-Error "Failed: $($fail -join '; ')"; exit 1 }
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        if: always()
        with:
          name: vendor-cases
          path: C:\ftest\out\
  live:
    # the PUBLISHED exe against the LIVE manifest. Only the first run (fresh install) sends the real anonymous count; every other run ticks "Don't send" or uses -no-report.
    if: inputs.release_tag != '' && inputs.set_code != ''
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    env:
      CODE: ${{ inputs.set_code }}
    steps:
      - name: Download the published exe and check it
        env:
          GH_TOKEN: ${{ github.token }}
